
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101114">
  <meta name="description" content="Bash 課程與程式碼筆記">
  <title>Bash 課程</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #101114;
      --surface: #17191e;
      --surface-hover: #1d2027;
      --border: #2a2d35;
      --text: #eceef3;
      --muted: #9298a5;
      --accent: #8bb8ff;
      --green: #8dd6ae;
      --danger: #f2a0a6;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      font-size: 14px;
      line-height: 1.65;
    }

    button, input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:focus-visible,
    input:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .app {
      width: min(100% - 40px, 980px);
      margin: 0 auto;
      padding: 26px 0 48px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 30px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
      color: var(--text);
      font-size: 20px;
      font-weight: 750;
      letter-spacing: -.5px;
    }

    .brand-icon {
      display: grid;
      place-items: center;
      width: 38px;
      height: 38px;
      flex-shrink: 0;
      border: 1px solid #343945;
      border-radius: 11px;
      background: #1b1e25;
      color: var(--accent);
      font-family: monospace;
      font-size: 15px;
    }

    .github-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      min-height: 36px;
      padding: 7px 11px;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: #c5cad4;
      background: var(--surface);
      font-size: 12px;
      white-space: nowrap;
      transition: background .15s, border-color .15s;
    }

    .github-link:hover {
      border-color: #484e5c;
      background: var(--surface-hover);
    }

    .search-section {
      margin-bottom: 24px;
    }

    .search-form {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 5px;
      border: 1px solid #343842;
      border-radius: 12px;
      background: var(--surface);
      transition: border-color .15s;
    }

    .search-form:focus-within {
      border-color: #607da8;
    }

    .search-icon {
      flex-shrink: 0;
      padding-left: 9px;
      color: var(--muted);
      font-size: 19px;
    }

    .search-input {
      width: 100%;
      min-width: 0;
      height: 38px;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
      font-size: 14px;
    }

    .search-input::placeholder {
      color: #737987;
    }

    .search-button {
      min-height: 36px;
      padding: 7px 13px;
      flex-shrink: 0;
      border: 0;
      border-radius: 8px;
      color: #101722;
      background: #b1ceff;
      font-size: 12px;
      font-weight: 700;
    }

    .search-button:hover {
      background: #c7dcff;
    }

    .button:disabled,
    .search-button:disabled {
      cursor: not-allowed;
      opacity: .4;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 17px;
    }

    .toolbar-left,
    .toolbar-right {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 34px;
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      color: #c8cdd7;
      background: var(--surface);
      font-size: 12px;
      transition: background .15s, border-color .15s;
    }

    .button:hover:not(:disabled) {
      border-color: #484e5c;
      background: var(--surface-hover);
    }

    .breadcrumb {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      margin-bottom: 15px;
      color: #747b89;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .breadcrumb button {
      padding: 0;
      border: 0;
      color: #a5adbb;
      background: transparent;
    }

    .breadcrumb button:hover {
      color: var(--accent);
    }

    .breadcrumb .current {
      color: #e0e4ec;
    }

    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 13px;
    }

    .section-heading h1 {
      min-width: 0;
      margin: 0;
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -.4px;
      overflow-wrap: anywhere;
    }

    .count {
      flex-shrink: 0;
      padding: 3px 9px;
      border: 1px solid #30343d;
      border-radius: 7px;
      color: #adb4c1;
      background: #191b21;
      font-size: 11px;
    }

    .status {
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .status.error {
      color: var(--danger);
    }

    .status.success {
      color: var(--green);
    }

    .file-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .file-card {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-width: 0;
      min-height: 72px;
      padding: 13px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      background: var(--surface);
      text-align: left;
      transition: background .15s, border-color .15s;
    }

    .file-card:hover {
      border-color: #444b59;
      background: var(--surface-hover);
    }

    /* Emoji 圖示：不再使用彩色方塊 */
    .file-icon {
      display: grid;
      place-items: center;
      width: 37px;
      height: 37px;
      flex-shrink: 0;
      border: none;
      border-radius: 0;
      color: inherit;
      background: transparent;
      font-size: 23px;
    }

    .file-icon.folder,
    .file-icon.code {
      border: none;
      background: transparent;
    }

    .file-info {
      flex: 1;
      min-width: 0;
    }

    .file-name {
      display: block;
      color: #e6e9ef;
      font-size: 13px;
      font-weight: 650;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .file-meta {
      display: block;
      margin-top: 3px;
      color: #858c99;
      font-size: 11px;
      overflow-wrap: anywhere;
    }

    .arrow {
      flex-shrink: 0;
      margin-left: auto;
      color: #737b89;
      font-size: 18px;
    }

    .result-card {
      align-items: flex-start;
      min-height: 0;
    }

    .result-card .file-icon {
      margin-top: 1px;
    }

    .snippet {
      display: block;
      margin-top: 8px;
      padding: 8px 9px;
      border: 1px solid #2a2e37;
      border-radius: 7px;
      color: #aeb5c2;
      background: #121419;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 11px;
      line-height: 1.65;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    mark {
      border-radius: 2px;
      color: #f6d995;
      background: #4b3b20;
    }

    .code-panel {
      grid-column: 1 / -1;
      overflow: hidden;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: #121419;
    }

    .code-toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 11px 12px;
      border-bottom: 1px solid var(--border);
      background: #191b21;
    }

    .code-filename {
      min-width: 0;
      color: #d6dbe5;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .code-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .code-actions .button {
      min-height: 30px;
    }

    pre {
      max-height: 68vh;
      min-height: 100px;
      margin: 0;
      padding: 17px;
      overflow: auto;
      color: #dce2ed;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 12px;
      line-height: 1.8;
      tab-size: 4;
      white-space: pre;
      -webkit-overflow-scrolling: touch;
    }

    .empty {
      grid-column: 1 / -1;
      padding: 34px 15px;
      border: 1px dashed #343842;
      border-radius: var(--radius);
      color: var(--muted);
      text-align: center;
    }

    .empty strong {
      display: block;
      margin-bottom: 5px;
      color: #dce1e9;
      font-size: 14px;
    }

    .empty p {
      margin: 0;
      font-size: 12px;
    }

    @media (min-width: 1100px) {
      .app {
        padding-top: 34px;
      }

      .header {
        margin-bottom: 34px;
      }

      .search-section {
        margin-bottom: 28px;
      }

      .file-list {
        gap: 12px;
      }

      .file-card {
        padding: 15px;
      }
    }

    @media (max-width: 640px) {
      .app {
        width: calc(100% - 28px);
        padding-top: 17px;
        padding-bottom: 30px;
      }

      .header {
        margin-bottom: 23px;
      }

      .brand {
        gap: 9px;
        font-size: 18px;
      }

      .brand-icon {
        width: 35px;
        height: 35px;
      }

      .github-link {
        width: 35px;
        min-width: 35px;
        height: 35px;
        padding: 0;
        font-size: 0;
      }

      .github-link::first-letter {
        font-size: 16px;
      }

      .search-section {
        margin-bottom: 21px;
      }

      .search-form {
        gap: 5px;
      }

      .search-input {
        font-size: 13px;
      }

      .search-button {
        padding: 7px 10px;
      }

      .toolbar {
        margin-bottom: 15px;
      }

      .toolbar-left,
      .toolbar-right {
        gap: 6px;
      }

      .button {
        min-height: 33px;
        padding: 6px 9px;
      }

      .section-heading h1 {
        font-size: 17px;
      }

      .file-list {
        grid-template-columns: minmax(0, 1fr);
        gap: 8px;
      }

      .file-card {
        min-height: 64px;
        padding: 11px;
        gap: 10px;
      }

      .file-icon {
        width: 36px;
        height: 36px;
      }

      .result-card {
        align-items: flex-start;
      }

      .snippet {
        font-size: 10px;
      }

      .code-toolbar {
        align-items: flex-start;
      }

      .code-filename {
        width: 100%;
      }

      pre {
        padding: 13px;
        font-size: 11px;
      }
    }

    @media (max-width: 360px) {
      .app {
        width: calc(100% - 22px);
      }

      .brand {
        font-size: 17px;
      }

      .search-button {
        padding: 6px 8px;
      }

      .toolbar-left {
        gap: 5px;
      }

      .button {
        padding: 5px 7px;
        font-size: 11px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="header">
      <a class="brand" href="./" aria-label="Bash 課程首頁">
        <span class="brand-icon">&gt;_</span>
        <span>Bash 課程</span>
      </a>

      <a
        class="github-link"
        href="https://github.com/zongyou0530/bash-course"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="開啟 GitHub 專案"
        title="GitHub 專案"
      >↗ GitHub</a>
    </header>

    <section class="search-section">
      <form class="search-form" id="searchForm">
        <span class="search-icon" aria-hidden="true">⌕</span>
        <input
          class="search-input"
          id="searchInput"
          type="search"
          placeholder="搜尋檔名、指令或筆記內容"
          autocomplete="off"
          spellcheck="false"
          aria-label="搜尋課程"
        >
        <button class="search-button" type="submit">搜尋</button>
      </form>
    </section>

    <div class="toolbar">
      <div class="toolbar-left">
        <button class="button" id="homeBtn" type="button">⌂ 首頁</button>
        <button class="button" id="backBtn" type="button" disabled>← 返回</button>
      </div>
      <div class="toolbar-right">
        <button class="button" id="refreshBtn" type="button">↻ 重新載入</button>
      </div>
    </div>

    <nav class="breadcrumb" id="breadcrumb" aria-label="目前位置"></nav>

    <section>
      <div class="section-heading">
        <h1 id="sectionTitle">課程檔案</h1>
        <span class="count" id="count">載入中</span>
      </div>

      <div class="status" id="status" role="status" aria-live="polite">
        正在讀取課程……
      </div>

      <div class="file-list" id="content"></div>
    </section>
  </main>

  <script>
    "use strict";

    const OWNER = "zongyou0530";
    const REPO = "bash-course";
    const BRANCH = "main";

    const API_ROOT =
      `https://api.github.com/repos/${OWNER}/${REPO}`;
    const RAW_ROOT =
      `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}`;
    const REPO_ROOT =
      `https://github.com/${OWNER}/${REPO}`;

    const SEARCH_EXTENSIONS =
      new Set(["sh", "bash", "zsh", "md", "txt"]);
    const IGNORED_ROOT_FILES =
      new Set(["README.md", "index.html"]);

    const $ = (id) => document.getElementById(id);

    const state = {
      path: "",
      view: { type: "folder", path: "" },
      history: [],
      searchIndex: null,
      searchPromise: null,
      busy: false,
      requestId: 0
    };

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function extension(path) {
      const name = path.split("/").pop() || "";
      const dot = name.lastIndexOf(".");
      return dot < 0 ? "" : name.slice(dot + 1).toLowerCase();
    }

    function basename(path) {
      return path.split("/").pop() || "課程檔案";
    }

    function apiUrl(path = "") {
      const encoded = path
        .split("/")
        .filter(Boolean)
        .map(encodeURIComponent)
        .join("/");

      return `${API_ROOT}/contents/${encoded}?ref=${encodeURIComponent(BRANCH)}`;
    }

    function rawUrl(path) {
      return `${RAW_ROOT}/${path.split("/").map(encodeURIComponent).join("/")}`;
    }

    function githubFileUrl(path) {
      return `${REPO_ROOT}/blob/${BRANCH}/${path.split("/").map(encodeURIComponent).join("/")}`;
    }

    function setStatus(message, type = "") {
      const el = $("status");
      el.className = `status${type ? " " + type : ""}`;
      el.textContent = message;
    }

    function setBusy(value) {
      state.busy = value;
      $("homeBtn").disabled = value;
      $("backBtn").disabled = value || state.history.length === 0;
      $("refreshBtn").disabled = value;
      $("searchInput").disabled = value;
      $("searchForm").querySelector("button").disabled = value;
    }

    function updateBackButton() {
      $("backBtn").disabled =
        state.busy || state.history.length === 0;
    }

    function rememberView() {
      state.history.push({ ...state.view });
      updateBackButton();
    }

    function showBreadcrumb(path) {
      const parts = path ? path.split("/") : [];
      let accumulated = "";
      let html = `<button type="button" data-path="">首頁</button>`;

      for (let i = 0; i < parts.length; i++) {
        accumulated = accumulated
          ? `${accumulated}/${parts[i]}`
          : parts[i];

        html += `<span>/</span>`;

        if (i === parts.length - 1) {
          html += `<span class="current">${escapeHtml(parts[i])}</span>`;
        } else {
          html += `
            <button type="button" data-path="${escapeHtml(accumulated)}">
              ${escapeHtml(parts[i])}
            </button>`;
        }
      }

      $("breadcrumb").innerHTML = html;

      $("breadcrumb").querySelectorAll("button[data-path]").forEach((button) => {
        button.addEventListener("click", () => {
          const target = button.dataset.path;

          if (target !== state.path || state.view.type !== "folder") {
            rememberView();
            showFolder(target);
          }
        });
      });
    }

    function showEmpty(title, message) {
      $("content").innerHTML = `
        <div class="empty">
          <strong>${escapeHtml(title)}</strong>
          <p>${escapeHtml(message)}</p>
        </div>`;
    }

    function ignoredRootFile(path) {
      return !path.includes("/") && IGNORED_ROOT_FILES.has(path);
    }

    function isFolder(item) {
      return item.type === "dir" || item.type === "tree";
    }

    function itemMeta(item) {
      if (isFolder(item)) return "資料夾";

      const ext = extension(item.path || item.name || "");
      const labels = {
        sh: "Shell Script",
        bash: "Bash Script",
        zsh: "Zsh Script",
        md: "Markdown 筆記",
        txt: "文字筆記"
      };

      return labels[ext] || (ext ? `${ext.toUpperCase()} 檔案` : "檔案");
    }

    /* Emoji 圖示 */
    function itemIcon(item) {
      if (isFolder(item)) return ["folder", "📁"];

      const ext = extension(item.path || item.name || "");

      if (["sh", "bash", "zsh"].includes(ext)) {
        return ["code", "💻"];
      }

      if (ext === "md") return ["", "📝"];
      if (ext === "txt") return ["", "📄"];

      return ["", "📃"];
    }

    function renderItems(items) {
      $("count").textContent = `${items.length} 個項目`;

      if (!items.length) {
        showEmpty("沒有檔案", "這個資料夾目前沒有可顯示的項目。");
        return;
      }

      $("content").innerHTML = items.map((item, index) => {
        const [iconClass, icon] = itemIcon(item);
        const name = item.name || basename(item.path || "");

        return `
          <button class="file-card" type="button" data-index="${index}">
            <span class="file-icon ${iconClass}">${icon}</span>
            <span class="file-info">
              <span class="file-name">${escapeHtml(name)}</span>
              <span class="file-meta">${escapeHtml(itemMeta(item))}</span>
            </span>
            <span class="arrow" aria-hidden="true">›</span>
          </button>`;
      }).join("");

      $("content").querySelectorAll(".file-card").forEach((card) => {
        card.addEventListener("click", () => {
          const item = items[Number(card.dataset.index)];
          if (!item) return;

          rememberView();

          if (isFolder(item)) {
            showFolder(item.path);
          } else {
            openFile(item.path);
          }
        });
      });
    }

    async function fetchJson(url) {
      const response = await fetch(url, {
        headers: { Accept: "application/vnd.github+json" }
      });

      if (!response.ok) {
        if (response.status === 403) {
          throw new Error("GitHub 請求次數可能已達限制，請稍後再試。");
        }

        if (response.status === 404) {
          throw new Error("找不到資料，請確認專案為公開狀態，且分支名稱為 main。");
        }

        throw new Error(`GitHub 請求失敗（HTTP ${response.status}）。`);
      }

      return response.json();
    }

    async function showFolder(path = "") {
      if (state.busy) return;

      const target = (path || "").replace(/^\/+|\/+$/g, "");

      state.requestId++;
      state.path = target;
      state.view = { type: "folder", path: target };

      $("searchInput").value = "";
      $("sectionTitle").textContent = target ? basename(target) : "課程檔案";
      $("content").innerHTML = "";
      $("count").textContent = "載入中";

      showBreadcrumb(target);
      setBusy(true);
      setStatus("正在讀取課程檔案……");

      try {
        const data = await fetchJson(apiUrl(target));

        if (!Array.isArray(data)) {
          throw new Error("回傳資料格式不正確。");
        }

        const items = data
          .filter((item) => !ignoredRootFile(item.path || item.name || ""))
          .sort((a, b) => {
            const aFolder = isFolder(a) ? 0 : 1;
            const bFolder = isFolder(b) ? 0 : 1;

            if (aFolder !== bFolder) return aFolder - bFolder;

            return (b.name || "").localeCompare(a.name || "", "zh-Hant", {
              numeric: true,
              sensitivity: "base"
            });
          });

        renderItems(items);
        setStatus("");
      } catch (error) {
        $("count").textContent = "載入失敗";
        showEmpty("無法載入課程", error.message || "請檢查網路後再試。");
        setStatus(error.message || "讀取失敗。", "error");
      } finally {
        setBusy(false);
        updateBackButton();
      }
    }

    async function openFile(path) {
      if (state.busy) return;

      const requestId = ++state.requestId;
      const parentPath = path.split("/").slice(0, -1).join("/");

      state.path = parentPath;
      state.view = { type: "file", path };

      $("sectionTitle").textContent = basename(path);
      $("count").textContent = "讀取中";
      $("content").innerHTML = "";

      showBreadcrumb(parentPath);
      setBusy(true);
      setStatus("正在讀取檔案內容……");

      try {
        const response = await fetch(rawUrl(path));

        if (!response.ok) {
          throw new Error(`無法讀取檔案（HTTP ${response.status}）。`);
        }

        const text = await response.text();

        if (requestId !== state.requestId) return;

        $("count").textContent = `${text.length.toLocaleString()} 字元`;

        $("content").innerHTML = `
          <div class="code-panel">
            <div class="code-toolbar">
              <span class="code-filename">${escapeHtml(path)}</span>
              <div class="code-actions">
                <button class="button" id="copyBtn" type="button">複製程式碼</button>
                <a class="button"
                   href="${escapeHtml(githubFileUrl(path))}"
                   target="_blank"
                   rel="noopener noreferrer">GitHub ↗</a>
              </div>
            </div>
            <pre><code id="codeContent">${escapeHtml(text)}</code></pre>
          </div>`;

        $("copyBtn").addEventListener("click", async () => {
          try {
            await copyText(text);
            $("copyBtn").textContent = "已複製 ✓";

            setTimeout(() => {
              const button = $("copyBtn");
              if (button) button.textContent = "複製程式碼";
            }, 1500);
          } catch {
            setStatus("複製失敗，請直接選取程式碼複製。", "error");
          }
        });

        setStatus("");
      } catch (error) {
        $("count").textContent = "讀取失敗";
        showEmpty("無法開啟檔案", error.message || "請稍後再試。");
        setStatus(error.message || "讀取失敗。", "error");
      } finally {
        setBusy(false);
        updateBackButton();
      }
    }

    async function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
        return;
      }

      const textarea = document.createElement("textarea");
      textarea.value = text;
      textarea.style.position = "fixed";
      textarea.style.opacity = "0";
      document.body.appendChild(textarea);
      textarea.select();

      const success = document.execCommand("copy");
      textarea.remove();

      if (!success) throw new Error("複製失敗");
    }

    async function buildSearchIndex() {
      if (state.searchIndex) return state.searchIndex;
      if (state.searchPromise) return state.searchPromise;

      state.searchPromise = (async () => {
        setStatus("第一次搜尋正在建立索引，請稍候……");

        const url =
          `${API_ROOT}/git/trees/${encodeURIComponent(BRANCH)}?recursive=1`;
        const treeData = await fetchJson(url);

        if (treeData.truncated) {
          throw new Error("GitHub 回傳的檔案清單不完整，請確認專案檔案數量。");
        }

        const files = (treeData.tree || []).filter((item) =>
          item.type === "blob" &&
          !ignoredRootFile(item.path) &&
          SEARCH_EXTENSIONS.has(extension(item.path)) &&
          (item.size || 0) < 500000
        );

        const index = [];
        let next = 0;

        async function worker() {
          while (next < files.length) {
            const item = files[next++];

            try {
              const response = await fetch(rawUrl(item.path));

              if (response.ok) {
                const text = await response.text();

                index.push({
                  name: basename(item.path),
                  path: item.path,
                  text,
                  searchable: `${item.path}\n${text}`.toLocaleLowerCase()
                });
              }
            } catch (error) {
              console.warn("略過無法讀取的檔案：", item.path, error);
            }
          }
        }

        await Promise.all(
          Array.from({ length: 6 }, () => worker())
        );

        state.searchIndex = index;
        return index;
      })();

      try {
        return await state.searchPromise;
      } finally {
        state.searchPromise = null;
      }
    }

    function makeSnippet(text, terms) {
      const lower = text.toLocaleLowerCase();
      let position = -1;

      for (const term of terms) {
        position = lower.indexOf(term);
        if (position >= 0) break;
      }

      if (position < 0) position = 0;

      const start = Math.max(0, position - 55);
      const end = Math.min(text.length, position + 150);
      let snippet = text.slice(start, end).replace(/\s+/g, " ").trim();

      if (start > 0) snippet = "…" + snippet;
      if (end < text.length) snippet += "…";

      return snippet;
    }

    function highlight(text, terms) {
      let result = escapeHtml(text);

      const uniqueTerms = [...new Set(terms)]
        .sort((a, b) => b.length - a.length);

      for (const term of uniqueTerms) {
        const safe = escapeHtml(term);
        const pattern = safe.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

        try {
          result = result.replace(
            new RegExp(`(${pattern})`, "gi"),
            "<mark>$1</mark>"
          );
        } catch {
          // 略過無法處理的搜尋字詞
        }
      }

      return result;
    }

    function renderSearchResults(matches, terms) {
      const shown = matches.slice(0, 100);
      $("count").textContent = `${matches.length} 筆`;

      if (!shown.length) {
        showEmpty("找不到符合的內容", "換個關鍵字試試，例如 if、read、變數或檔案檢查。");
      } else {
        $("content").innerHTML = shown.map((item, index) => `
          <button class="file-card result-card" type="button" data-index="${index}">
            <span class="file-icon code">💻</span>
            <span class="file-info">
              <span class="file-name">${highlight(item.name, terms)}</span>
              <span class="file-meta">${escapeHtml(item.path)}</span>
              <span class="snippet">${highlight(makeSnippet(item.text, terms), terms)}</span>
            </span>
          </button>
        `).join("");

        $("content").querySelectorAll(".result-card").forEach((card) => {
          card.addEventListener("click", () => {
            const item = shown[Number(card.dataset.index)];
            if (!item) return;

            rememberView();
            openFile(item.path);
          });
        });
      }

      setStatus(
        matches.length > 100
          ? `找到 ${matches.length} 筆，目前顯示前 100 筆。`
          : `共找到 ${matches.length} 筆。`,
        "success"
      );
    }

    async function searchAll() {
      const query = $("searchInput").value.trim();

      if (!query) {
        setStatus("請輸入要搜尋的內容。");
        $("searchInput").focus();
        return;
      }

      if (state.busy) return;

      rememberView();

      const requestId = ++state.requestId;
      const terms = query.toLocaleLowerCase().split(/\s+/).filter(Boolean);

      state.view = { type: "search", query };

      $("sectionTitle").textContent = "搜尋結果";
      $("content").innerHTML = "";
      $("count").textContent = "搜尋中";

      showBreadcrumb("");
      setBusy(true);
      setStatus("正在搜尋所有課程檔案……");

      try {
        const index = await buildSearchIndex();

        if (requestId !== state.requestId) return;

        const matches = index
          .filter((item) =>
            terms.every((term) => item.searchable.includes(term))
          )
          .sort((a, b) => {
            const aName = a.name.toLocaleLowerCase().includes(terms[0]) ? 0 : 1;
            const bName = b.name.toLocaleLowerCase().includes(terms[0]) ? 0 : 1;

            return aName - bName || a.path.localeCompare(b.path, "zh-Hant", {
              numeric: true
            });
          });

        renderSearchResults(matches, terms);
      } catch (error) {
        $("count").textContent = "搜尋失敗";
        showEmpty("搜尋失敗", error.message || "請稍後再試。");
        setStatus(error.message || "無法建立搜尋索引。", "error");
      } finally {
        setBusy(false);
        updateBackButton();
      }
    }

    async function searchAllWithoutHistory(query) {
      if (state.busy) return;

      const requestId = ++state.requestId;
      const terms = query.toLocaleLowerCase().split(/\s+/).filter(Boolean);

      state.view = { type: "search", query };

      $("sectionTitle").textContent = "搜尋結果";
      $("content").innerHTML = "";
      $("count").textContent = "搜尋中";

      showBreadcrumb("");
      setBusy(true);
      setStatus("正在搜尋所有課程檔案……");

      try {
        const index = await buildSearchIndex();

        if (requestId !== state.requestId) return;

        const matches = index
          .filter((item) =>
            terms.every((term) => item.searchable.includes(term))
          )
          .sort((a, b) => {
            const aName = a.name.toLocaleLowerCase().includes(terms[0]) ? 0 : 1;
            const bName = b.name.toLocaleLowerCase().includes(terms[0]) ? 0 : 1;

            return aName - bName || a.path.localeCompare(b.path, "zh-Hant", {
              numeric: true
            });
          });

        renderSearchResults(matches, terms);
      } catch (error) {
        $("count").textContent = "搜尋失敗";
        showEmpty("搜尋失敗", error.message || "請稍後再試。");
        setStatus(error.message || "無法建立搜尋索引。", "error");
      } finally {
        setBusy(false);
        updateBackButton();
      }
    }

    function goHome() {
      if (state.busy) return;

      state.history = [];
      showFolder("");
    }

    async function goBack() {
      if (state.busy || state.history.length === 0) return;

      const previous = state.history.pop();
      updateBackButton();

      if (previous.type === "folder") {
        await showFolder(previous.path);
      } else if (previous.type === "file") {
        await openFile(previous.path);
      } else if (previous.type === "search") {
        $("searchInput").value = previous.query;
        await searchAllWithoutHistory(previous.query);
      }
    }

    $("searchForm").addEventListener("submit", (event) => {
      event.preventDefault();
      searchAll();
    });

    $("homeBtn").addEventListener("click", goHome);
    $("backBtn").addEventListener("click", goBack);

    $("refreshBtn").addEventListener("click", () => {
      if (state.busy) return;

      state.history = [];
      state.searchIndex = null;
      state.searchPromise = null;

      showFolder("");
    });

    $("searchInput").addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        $("searchInput").value = "";

        if (state.view.type === "search") {
          goBack();
        }
      }
    });

    showFolder("");
  </script>
</body>
