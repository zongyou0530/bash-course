
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080a14">
  <title>計算機實務應用 | Learning Bash</title>
  <link rel="icon" type="image/png" href="./favicon.png.png">
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      color-scheme: dark;
      --bg: #080a14;
      --panel: rgba(18, 22, 43, .78);
      --panel-solid: #111529;
      --border: rgba(210, 210, 255, .13);
      --border-hover: rgba(167, 139, 250, .45);
      --text: #f0f1ff;
      --muted: #9096b5;
      --purple: #b7a0ff;
      --blue: #78aaff;
      --cyan: #8deaff;
      --green: #86efac;
      --radius: 20px;
      --shadow: 0 20px 65px rgba(0, 0, 0, .24);
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 320px;
      scroll-behavior: smooth;
      scrollbar-color: #454064 #0c0e1b;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(ellipse at 12% 0%, rgba(100, 70, 220, .18), transparent 38%),
        radial-gradient(ellipse at 88% 15%, rgba(45, 100, 220, .13), transparent 34%),
        var(--bg);
      color: var(--text);
      font-family: Inter, "Noto Sans TC", sans-serif;
      font-size: 14px;
      line-height: 1.65;
    }

    button, input {
      font: inherit;
    }

    button {
      color: inherit;
      cursor: pointer;
    }

    button:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    button:focus-visible,
    input:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 3px;
    }

    button:active {
      transform: scale(.985);
    }

    ::selection {
      background: rgba(139, 92, 246, .42);
    }

    a {
      color: var(--cyan);
      overflow-wrap: anywhere;
    }

    .ambient {
      position: fixed;
      width: 360px;
      height: 360px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: .12;
      pointer-events: none;
      z-index: -1;
      animation: float 28s ease-in-out infinite alternate;
    }

    .ambient.one {
      background: #7548ff;
      top: 35%;
      left: -230px;
    }

    .ambient.two {
      background: #278cff;
      top: 65%;
      right: -240px;
      animation-delay: -10s;
    }

    @keyframes float {
      from { transform: translateY(-30px); }
      to { transform: translateY(50px); }
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(9px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .app {
      width: min(1440px, 100%);
      margin: 0 auto;
      padding: 28px 34px 20px;
    }

    /* 頂部主視覺 */
    .hero {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      padding: 25px 28px 28px;
      margin-bottom: 24px;
      border: 1px solid rgba(205, 195, 255, .22);
      border-radius: 27px;
      background:
        radial-gradient(ellipse at 90% 0%, rgba(103, 232, 249, .18), transparent 38%),
        radial-gradient(ellipse at 0% 100%, rgba(139, 92, 246, .24), transparent 46%),
        linear-gradient(125deg, rgba(43, 46, 87, .85), rgba(39, 32, 77, .78) 52%, rgba(16, 48, 69, .82));
      box-shadow:
        0 24px 75px rgba(0, 0, 0, .25),
        inset 0 1px 1px rgba(255, 255, 255, .12);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      animation: appear .7s ease both;
    }

    .hero-topline {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 23px;
    }

    .eyebrow {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0;
      color: #d0c6ff;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .15em;
    }

    .eyebrow::before {
      content: "";
      width: 25px;
      height: 1px;
      flex-shrink: 0;
      background: linear-gradient(90deg, var(--purple), var(--cyan));
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      padding: 6px 11px;
      border: 1px solid rgba(255, 255, 255, .16);
      border-radius: 30px;
      color: #e0e4ff;
      background: rgba(12, 15, 34, .35);
      font-size: 12px;
      white-space: nowrap;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      flex-shrink: 0;
      border-radius: 50%;
      background: #fbbf24;
    }

    .status.online .status-dot {
      background: #4ade80;
      box-shadow: 0 0 10px rgba(74, 222, 128, .65);
    }

    .status.offline .status-dot {
      background: #fb7185;
      box-shadow: 0 0 10px rgba(251, 113, 133, .55);
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 37px;
      height: 37px;
      flex-shrink: 0;
      padding: 0;
      border: 1px solid var(--border);
      border-radius: 11px;
      color: #d9d5ff;
      background: rgba(13, 16, 36, .4);
      transition: background .2s, border-color .2s, transform .2s;
    }

    .icon-btn:hover {
      border-color: var(--border-hover);
      background: rgba(139, 92, 246, .17);
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(27px, 3.6vw, 43px);
      font-weight: 800;
      line-height: 1.35;
      letter-spacing: -.035em;
    }

    .gradient-text {
      background: linear-gradient(105deg, #e0d5ff 4%, #a5b4fc 48%, #8deaff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .hero-description {
      margin: 12px 0 0;
      color: #b3b8d5;
      font-size: 13px;
    }

    /* 搜尋 */
    .search-wrap {
      position: relative;
      width: min(850px, 100%);
      margin-top: 25px;
    }

    .search-box {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 58px;
      padding: 8px 10px 8px 17px;
      border: 1px solid rgba(222, 218, 255, .22);
      border-radius: 16px;
      background: rgba(12, 15, 35, .5);
      transition: border-color .2s, box-shadow .2s, background .2s;
    }

    .search-box:focus-within {
      border-color: rgba(184, 165, 255, .7);
      background: rgba(25, 27, 57, .72);
      box-shadow: 0 0 0 4px rgba(139, 92, 246, .09);
    }

    .search-icon {
      flex-shrink: 0;
      color: #a9add0;
    }

    .search-box input {
      flex: 1;
      min-width: 0;
      width: 0;
      border: 0;
      outline: 0;
      color: var(--text);
      background: transparent;
      font-size: 14px;
    }

    .search-box input::placeholder {
      color: #858baa;
    }

    .search-box input::-webkit-search-cancel-button {
      display: none;
    }

    .search-shortcut {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 25px;
      height: 26px;
      padding: 0 7px;
      border: 1px solid rgba(255, 255, 255, .13);
      border-radius: 6px;
      color: #a5aac8;
      background: rgba(255, 255, 255, .04);
      font: 12px "JetBrains Mono", monospace;
    }

    .search-clear {
      display: none;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      border-radius: 8px;
      color: #b9bdd7;
      background: transparent;
    }

    .search-clear.visible {
      display: inline-flex;
    }

    .search-clear:hover {
      background: rgba(255, 255, 255, .09);
    }

    /* 主工作區 */
    .workspace {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      align-items: start;
      gap: 20px;
    }

    .panel {
      min-width: 0;
      overflow: hidden;
      border: 1px solid rgba(205, 200, 255, .15);
      border-radius: var(--radius);
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
    }

    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 58px;
      padding: 12px 16px;
      border-bottom: 1px solid rgba(200, 195, 255, .11);
      background: rgba(255, 255, 255, .025);
    }

    .panel-heading {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #e4e4ff;
      font-size: 13px;
      font-weight: 700;
    }

    .heading-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 27px;
      height: 27px;
      border: 1px solid rgba(167, 139, 250, .23);
      border-radius: 8px;
      color: var(--purple);
      background: rgba(139, 92, 246, .12);
      font-size: 14px;
    }

    .tree-content {
      max-height: 720px;
      overflow: auto;
      padding: 12px;
    }

    .tree-root-label {
      padding: 5px 9px 12px;
      color: #777fa4;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .12em;
      overflow-wrap: anywhere;
    }

    .tree-item {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      min-width: 0;
      padding: 10px;
      margin-bottom: 3px;
      border: 1px solid transparent;
      border-radius: 11px;
      color: #c0c5de;
      background: transparent;
      text-align: left;
      transition: background .2s, border-color .2s, color .2s;
    }

    .tree-item:hover {
      background: rgba(255, 255, 255, .045);
      color: white;
    }

    .tree-item.active {
      border-color: rgba(167, 139, 250, .24);
      background: linear-gradient(110deg, rgba(139, 92, 246, .18), rgba(59, 130, 246, .08));
      color: #e8e1ff;
    }

    .item-symbol {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 27px;
      min-width: 27px;
      flex-shrink: 0;
      font-size: 17px;
      line-height: 1.4;
    }

    .item-name {
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere;
      font-size: 12px;
    }

    .item-chevron {
      flex-shrink: 0;
      margin-left: auto;
      color: #777fa6;
      font-size: 17px;
    }

    .tree-empty {
      padding: 25px 10px;
      color: var(--muted);
      text-align: center;
      font-size: 12px;
    }

    /* 右側內容標題 */
    .content-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      min-height: 111px;
      padding: 22px 23px;
      border-bottom: 1px solid rgba(200, 195, 255, .1);
      background: linear-gradient(110deg, rgba(139, 92, 246, .045), transparent 70%);
    }

    .content-title-wrap {
      flex: 1;
      min-width: 0;
    }

    .content-kicker {
      margin-bottom: 5px;
      color: #9395c4;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: .14em;
    }

    .content-title {
      margin: 0;
      color: #f0efff;
      font-size: 22px;
      font-weight: 700;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .content-subtitle {
      margin-top: 5px;
      color: #9299b8;
      font-size: 12px;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .content-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      flex-wrap: wrap;
      gap: 8px;
      flex-shrink: 0;
    }

    .action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 35px;
      padding: 7px 11px;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: #cbd0ed;
      background: rgba(255, 255, 255, .035);
      font-size: 11px;
      white-space: nowrap;
      transition: background .2s, border-color .2s;
    }

    .action-btn:hover {
      border-color: var(--border-hover);
      background: rgba(139, 92, 246, .12);
    }

    .action-btn.primary {
      border-color: rgba(167, 139, 250, .35);
      color: #eee8ff;
      background: rgba(124, 92, 230, .22);
    }

    .action-btn.primary:hover {
      background: rgba(124, 92, 230, .34);
    }

    /* 麵包屑 */
    .breadcrumbs {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 7px;
      min-height: 43px;
      padding: 9px 22px;
      border-bottom: 1px solid rgba(200, 195, 255, .08);
      color: #9299b8;
      font-size: 11px;
    }

    .crumb {
      max-width: 100%;
      padding: 2px 0;
      border: 0;
      color: #aeb5d5;
      background: transparent;
      font-size: 11px;
      overflow-wrap: anywhere;
    }

    .crumb:hover,
    .crumb.current {
      color: #e3d9ff;
    }

    .crumb-separator {
      color: #555b7b;
    }

    /* 資料夾檔案列表 */
    .file-list {
      padding: 13px;
    }

    .file-row {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 100%;
      min-width: 0;
      margin-bottom: 5px;
      padding: 12px 13px;
      border: 1px solid transparent;
      border-radius: 12px;
      color: var(--text);
      background: transparent;
      text-align: left;
      animation: appear .4s ease both;
      transition: border-color .2s, background .2s, transform .2s;
    }

    .file-row:hover {
      border-color: rgba(190, 180, 255, .16);
      background: rgba(255, 255, 255, .045);
    }

    .file-info {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .file-name {
      color: #e1e4fb;
      font-size: 13px;
      font-weight: 600;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .file-meta {
      color: #838bab;
      font-size: 11px;
      overflow-wrap: anywhere;
    }

    .file-arrow {
      flex-shrink: 0;
      margin-left: auto;
      color: #8389ac;
      font-size: 19px;
    }

    /* 程式碼檢視 */
    .code-view {
      min-width: 0;
      margin: 15px;
      overflow: hidden;
      border: 1px solid rgba(200, 195, 255, .12);
      border-radius: 14px;
      background: rgba(7, 10, 20, .7);
    }

    .code-toolbar {
      display: flex;
      align-items: center;
      gap: 13px;
      min-height: 45px;
      padding: 10px 15px;
      border-bottom: 1px solid rgba(200, 195, 255, .1);
      background: rgba(255, 255, 255, .025);
    }

    .window-dots {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .window-dots span {
      display: block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #777fa0;
    }

    .window-dots span:nth-child(1) { background: #fb7185; }
    .window-dots span:nth-child(2) { background: #fbbf24; }
    .window-dots span:nth-child(3) { background: #4ade80; }

    .code-language {
      color: #a4a8c8;
      font: 10px "JetBrains Mono", monospace;
      letter-spacing: .08em;
    }

    .code-container {
      max-width: 100%;
      max-height: 65vh;
      overflow: auto;
      background: rgba(7, 10, 20, .55);
      scrollbar-color: #454064 #0c0e1b;
    }

    .code-container pre {
      margin: 0;
      padding: 17px 0;
      min-width: max-content;
      color: #dce3ff;
      font: 12px/1.85 "JetBrains Mono", monospace;
      tab-size: 4;
    }

    .code-container pre code {
      display: block;
      padding: 0 20px;
      color: inherit;
      background: transparent;
      font: inherit;
    }

    .code-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 43px;
      padding: 8px 14px;
      border-top: 1px solid rgba(200, 195, 255, .1);
      color: #858baa;
      background: rgba(255, 255, 255, .02);
      font-size: 10px;
    }

    .code-footer button {
      padding: 6px 9px;
      border: 1px solid rgba(167, 139, 250, .22);
      border-radius: 7px;
      color: #d7cbff;
      background: rgba(139, 92, 246, .1);
      font-size: 10px;
    }

    .code-footer button:hover {
      background: rgba(139, 92, 246, .2);
    }

    /* Markdown 預覽 */
    .text-view {
      padding: 25px;
      color: #d6daf2;
      font-size: 13px;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .text-view > :first-child {
      margin-top: 0;
    }

    .text-view h1,
    .text-view h2,
    .text-view h3,
    .text-view h4 {
      margin-top: 1.5em;
      margin-bottom: .6em;
      color: #eeeaff;
      line-height: 1.45;
    }

    .text-view h1 {
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      font-size: 25px;
    }

    .text-view h2 {
      padding-bottom: 7px;
      border-bottom: 1px solid rgba(200, 195, 255, .1);
      font-size: 21px;
    }

    .text-view h3 { font-size: 17px; }

    .text-view p {
      margin: 13px 0;
    }

    .text-view ul,
    .text-view ol {
      padding-left: 24px;
    }

    .text-view li {
      margin: 5px 0;
    }

    .text-view blockquote {
      margin: 16px 0;
      padding: 4px 14px;
      border-left: 3px solid #9b87f5;
      color: #b9bfdc;
      background: rgba(139, 92, 246, .06);
    }

    .text-view pre {
      max-width: 100%;
      overflow: auto;
      padding: 15px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: rgba(7, 10, 20, .7);
    }

    .text-view pre code {
      font: 12px/1.8 "JetBrains Mono", monospace;
    }

    .text-view :not(pre) > code {
      padding: 2px 5px;
      border-radius: 5px;
      color: #d9caff;
      background: rgba(139, 92, 246, .15);
      font: 12px "JetBrains Mono", monospace;
      overflow-wrap: anywhere;
    }

    .text-view img {
      max-width: 100%;
      height: auto;
      border-radius: 9px;
    }

    .text-view table {
      display: block;
      max-width: 100%;
      overflow-x: auto;
      border-collapse: collapse;
    }

    .text-view th,
    .text-view td {
      padding: 8px 10px;
      border: 1px solid var(--border);
      text-align: left;
    }

    .text-view th {
      background: rgba(139, 92, 246, .12);
    }

    .text-view hr {
      border: 0;
      border-top: 1px solid var(--border);
    }

    mark {
      border-radius: 3px;
      color: #f0e9ff;
      background: rgba(139, 92, 246, .3);
    }

    /* 全域搜尋結果 */
    .results-section {
      padding: 16px;
    }

    .results-label {
      margin: 0 0 13px;
      color: #9da3c5;
      font-size: 11px;
    }

    .result-card {
      display: block;
      width: 100%;
      margin-bottom: 8px;
      padding: 13px;
      border: 1px solid rgba(200, 195, 255, .09);
      border-radius: 12px;
      color: var(--text);
      background: rgba(255, 255, 255, .018);
      text-align: left;
      transition: background .2s, border-color .2s;
    }

    .result-card:hover {
      border-color: var(--border-hover);
      background: rgba(139, 92, 246, .07);
    }

    .result-top {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      width: 100%;
    }

    .result-main {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .result-name {
      color: #e6e4ff;
      font-size: 12px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .result-path {
      color: #858eaf;
      font-size: 10px;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    .result-snippet {
      display: block;
      margin: 10px 0 0 37px;
      padding: 9px 11px;
      border-radius: 7px;
      color: #aeb5d1;
      background: rgba(7, 10, 20, .48);
      font: 11px/1.8 "JetBrains Mono", monospace;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    /* 載入中、空狀態與錯誤 */
    .loading-line {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-height: 170px;
      padding: 25px;
      color: #9ba2c5;
      font-size: 12px;
      text-align: center;
    }

    .spinner {
      display: inline-block;
      width: 17px;
      height: 17px;
      flex-shrink: 0;
      border: 2px solid rgba(167, 139, 250, .2);
      border-top-color: #b7a0ff;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 235px;
      padding: 30px 22px;
      text-align: center;
    }

    .empty-symbol {
      margin-bottom: 12px;
      color: #a8a0db;
      font-size: 29px;
    }

    .empty-title {
      color: #e4e4fb;
      font-size: 14px;
      font-weight: 700;
    }

    .empty-desc {
      max-width: 420px;
      margin-top: 7px;
      color: #9299b8;
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .retry-btn {
      margin-top: 17px;
      padding: 9px 14px;
      border: 1px solid rgba(167, 139, 250, .3);
      border-radius: 9px;
      color: #e1d8ff;
      background: rgba(139, 92, 246, .14);
      font-size: 12px;
    }

    .retry-btn:hover {
      background: rgba(139, 92, 246, .24);
    }

    /* 頁尾與提示 */
    .footer {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 0 8px;
      color: #626986;
      font-size: 10px;
      letter-spacing: .04em;
    }

    .toast {
      position: fixed;
      z-index: 20;
      left: 50%;
      bottom: 25px;
      max-width: calc(100vw - 32px);
      padding: 11px 17px;
      border: 1px solid rgba(190, 170, 255, .35);
      border-radius: 12px;
      color: #eee8ff;
      background: rgba(25, 21, 45, .94);
      box-shadow: 0 12px 35px rgba(0, 0, 0, .3);
      font-size: 12px;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 12px);
      transition: opacity .25s, transform .25s;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* 平板 */
    @media (max-width: 1050px) {
      .app {
        padding: 22px 22px 18px;
      }

      .workspace {
        grid-template-columns: 255px minmax(0, 1fr);
        gap: 15px;
      }

      .hero {
        padding: 23px;
      }

      .content-header {
        padding: 19px;
      }

      .content-actions {
        max-width: 45%;
      }
    }

    /* 手機：目錄與內容改成上下排列 */
    @media (max-width: 760px) {
      .app {
        padding: 15px 12px 14px;
      }

      .hero {
        padding: 19px 17px 20px;
        margin-bottom: 15px;
        border-radius: 20px;
      }

      .hero-topline {
        gap: 10px;
        margin-bottom: 22px;
      }

      .eyebrow {
        gap: 7px;
        font-size: 10px;
        letter-spacing: .08em;
      }

      .eyebrow::before {
        width: 16px;
      }

      .top-actions {
        gap: 7px;
      }

      .status {
        gap: 6px;
        padding: 6px 8px;
        font-size: 10px;
      }

      .icon-btn {
        width: 34px;
        height: 34px;
      }

      .hero h1 {
        font-size: clamp(26px, 7vw, 35px);
      }

      .hero-description {
        font-size: 12px;
      }

      .search-wrap {
        margin-top: 21px;
      }

      .search-box {
        min-height: 52px;
        gap: 9px;
        padding-left: 13px;
      }

      .search-box input {
        font-size: 12px;
      }

      .search-shortcut {
        display: none;
      }

      .workspace {
        grid-template-columns: minmax(0, 1fr);
        gap: 14px;
      }

      .panel {
        border-radius: 16px;
      }

      .panel-header {
        min-height: 53px;
        padding: 10px 13px;
      }

      .tree-content {
        max-height: 260px;
        padding: 9px;
      }

      .tree-item {
        padding: 9px;
      }

      .content-header {
        align-items: flex-start;
        flex-direction: column;
        gap: 13px;
        min-height: 0;
        padding: 18px 16px;
      }

      .content-title {
        font-size: 20px;
      }

      .content-actions {
        max-width: 100%;
        justify-content: flex-start;
      }

      .breadcrumbs {
        padding: 9px 15px;
      }

      .file-list {
        padding: 9px;
      }

      .file-row {
        gap: 9px;
        padding: 11px 9px;
      }

      .file-name {
        font-size: 12px;
      }

      .code-view {
        margin: 9px;
        border-radius: 10px;
      }

      .code-container {
        max-height: 60vh;
      }

      .code-container pre {
        font-size: 11px;
      }

      .code-container pre code {
        padding: 0 13px;
      }

      .code-footer {
        align-items: flex-start;
        flex-wrap: wrap;
      }

      .text-view {
        padding: 17px 15px;
        font-size: 12px;
      }

      .text-view h1 { font-size: 22px; }
      .text-view h2 { font-size: 19px; }

      .results-section {
        padding: 11px;
      }

      .result-card {
        padding: 11px;
      }

      .result-snippet {
        margin-left: 0;
        font-size: 10px;
      }

      .footer {
        padding-top: 20px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

<body>
  <div class="ambient one"></div>
  <div class="ambient two"></div>

  <div class="app">
    <section class="hero">
      <div class="hero-topline">
        <div class="eyebrow">課程作業題目及程式碼</div>

        <div class="top-actions">
          <div class="status" id="connectionStatus">
            <span class="status-dot"></span>
            <span id="statusText">連線中</span>
          </div>

          <button class="icon-btn" id="reloadBtn" title="重新載入資料" aria-label="重新載入資料">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 7v5h-5M4 17v-5h5"/>
              <path d="M5.5 9a7 7 0 0 1 12-2L20 12M4 12l2.5 5a7 7 0 0 0 12-2"/>
            </svg>
          </button>
        </div>
      </div>

      <h1>計算機實務應用<br><span class="gradient-text">Learning Bash</span></h1>
      <p class="hero-description">題目為 Markdown 檔，Bash 程式碼結尾是 .sh。</p>

      <div class="search-wrap">
        <div class="search-box">
          <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/>
            <path d="m20 20-4-4"/>
          </svg>
          <input id="searchInput" type="search" placeholder="搜尋檔案名稱、程式碼內容……" autocomplete="off" aria-label="搜尋檔案名稱與程式碼內容">
          <kbd class="search-shortcut">/</kbd>
          <button class="search-clear" id="clearSearch" aria-label="清除搜尋" title="清除搜尋">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="m18 6-12 12M6 6l12 12"/>
            </svg>
          </button>
        </div>
      </div>
    </section>

    <main class="workspace">
      <aside class="panel">
        <div class="panel-header">
          <div class="panel-heading">
            <span class="heading-icon">⌘</span>
            <span>課程檔案</span>
          </div>
          <button class="icon-btn" id="rootBtn" title="回到根目錄" aria-label="回到根目錄">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="m3 10 9-7 9 7"/>
              <path d="M5 9v12h14V9M9 21v-7h6v7"/>
            </svg>
          </button>
        </div>

        <div class="tree-content" id="folderTree">
          <div class="loading-line"><span class="spinner"></span>正在載入檔案……</div>
        </div>
      </aside>

      <section class="panel content-panel">
        <div class="content-header" id="contentHeader">
          <div class="content-title-wrap">
            <div class="content-kicker">DIRECTORY / BROWSE</div>
            <h2 class="content-title">課程檔案</h2>
            <div class="content-subtitle">正在連線至 GitHub……</div>
          </div>
        </div>

        <div class="breadcrumbs" id="breadcrumbs"></div>

        <div id="mainContent">
          <div class="loading-line"><span class="spinner"></span>正在載入資料……</div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <span>Powered by GitHub Pages</span>
    </footer>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
  (() => {
    "use strict";

    const OWNER = "zongyou0530";
    const REPO = "bash-course";
    const BRANCHES = ["main", "master"];
    const API_BASE = `https://api.github.com/repos/${OWNER}/${REPO}`;
    const RAW_BASE = `https://raw.githubusercontent.com/${OWNER}/${REPO}`;

    const $ = selector => document.querySelector(selector);

    const statusEl = $("#connectionStatus");
    const statusTextEl = $("#statusText");
    const treeEl = $("#folderTree");
    const headerEl = $("#contentHeader");
    const crumbsEl = $("#breadcrumbs");
    const contentEl = $("#mainContent");
    const searchInput = $("#searchInput");
    const clearSearchBtn = $("#clearSearch");
    const toastEl = $("#toast");

    let branch = "main";
    let allFiles = [];
    let currentPath = "";
    let currentFile = null;
    let searchToken = 0;
    let searchTimer = null;
    let toastTimer = null;

    const contentCache = new Map();

    /* 隱藏網站系統檔案，不會刪除 GitHub 上的實際檔案 */
    const HIDDEN_ROOT_FILES = new Set([
      "index.html",
      "README.md",
      "favicon.png.png",
      "apple-touch-icon.png",
      "apple-touch-icon.png"
    ]);

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function safeURL(value) {
      try {
        const url = new URL(value, location.href);
        if (["http:", "https:", "mailto:"].includes(url.protocol)) {
          return url.href;
        }
      } catch {}
      return "";
    }

    function isHiddenRootFile(path) {
      return !path.includes("/") && HIDDEN_ROOT_FILES.has(path);
    }

    function getExtension(path) {
      const name = path.split("/").pop().toLowerCase();
      if (name === "makefile" || name === "dockerfile") return name;
      const index = name.lastIndexOf(".");
      return index > 0 ? name.slice(index + 1) : "";
    }

    function isTextFile(file) {
      const ext = getExtension(file.path);
      const textExtensions = new Set([
        "sh", "bash", "zsh", "md", "markdown", "txt", "log",
        "js", "mjs", "cjs", "ts", "py", "html", "htm", "css",
        "json", "xml", "svg", "yml", "yaml", "c", "h", "cpp",
        "hpp", "java", "go", "rs", "sql", "csv", "ini", "conf",
        "toml", "makefile", "dockerfile"
      ]);
      return textExtensions.has(ext) && (file.size || 0) <= 1024 * 1024;
    }

    function fileIcon(file) {
      if (file.type === "tree") return "📁";

      const ext = getExtension(file.path);
      const icons = {
        sh: "⌘", bash: "⌘", zsh: "⌘",
        md: "📝", markdown: "📝", txt: "📄",
        html: "🌐", htm: "🌐", css: "🎨",
        js: "⚡", mjs: "⚡", cjs: "⚡",
        py: "🐍", json: "🔧",
        jpg: "🖼️", jpeg: "🖼️", png: "🖼️",
        gif: "🖼️", svg: "🖼️",
        pdf: "📕", zip: "📦", csv: "📊"
      };
      return icons[ext] || "📄";
    }

    function formatSize(size) {
      if (size < 1024) return `${size} B`;
      if (size < 1024 * 1024) return `${(size / 1024).toFixed(1)} KB`;
      return `${(size / (1024 * 1024)).toFixed(1)} MB`;
    }

    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2500);
    }

    function setStatus(message, state = "") {
      statusTextEl.textContent = message;
      statusEl.classList.remove("online", "offline");
      if (state) statusEl.classList.add(state);
    }

    function setLoading(message) {
      contentEl.innerHTML = `
        <div class="loading-line">
          <span class="spinner"></span>
          ${escapeHTML(message)}
        </div>`;
    }

    async function fetchJSON(url) {
      const response = await fetch(url, {
        headers: { "Accept": "application/vnd.github+json" }
      });
      if (!response.ok) {
        throw new Error(`GitHub API 回應錯誤：${response.status}`);
      }
      return response.json();
    }

    async function fetchText(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`讀取檔案失敗：${response.status}`);
      return response.text();
    }

    async function loadRepository() {
      setStatus("連線中");
      treeEl.innerHTML = `
        <div class="loading-line">
          <span class="spinner"></span>正在取得檔案列表……
        </div>`;

      headerEl.innerHTML = `
        <div class="content-title-wrap">
          <div class="content-kicker">DIRECTORY / BROWSE</div>
          <h2 class="content-title">課程檔案</h2>
          <div class="content-subtitle">正在連線至 GitHub……</div>
        </div>`;

      setLoading("正在載入課程檔案……");

      let lastError = null;

      for (const candidateBranch of BRANCHES) {
        try {
          const data = await fetchJSON(
            `${API_BASE}/git/trees/${encodeURIComponent(candidateBranch)}?recursive=1`
          );

          if (data.truncated) {
            console.warn("GitHub 回傳的檔案清單可能不完整。");
          }

          branch = candidateBranch;
          allFiles = data.tree
            .filter(item => item.type === "blob")
            .filter(item => !isHiddenRootFile(item.path))
            .map(item => ({
              path: item.path,
              name: item.path.split("/").pop(),
              size: item.size || 0,
              type: "blob"
            }))
            .sort((a, b) =>
              a.path.localeCompare(b.path, "zh-Hant", { numeric: true })
            );

          contentCache.clear();
          currentPath = "";
          currentFile = null;
          setStatus("已連線", "online");
          renderFolder("");
          return;
        } catch (error) {
          lastError = error;
        }
      }

      console.error(lastError);
      setStatus("連線失敗", "offline");

      treeEl.innerHTML = `
        <div class="empty-state">
          <div class="empty-symbol">⚠</div>
          <div class="empty-title">無法載入檔案</div>
          <div class="empty-desc">請確認網路連線、儲存庫是否公開，或稍後重新載入。</div>
          <button class="retry-btn" id="retryLoadBtn">重新嘗試</button>
        </div>`;

      contentEl.innerHTML = `
        <div class="empty-state">
          <div class="empty-symbol">⚠</div>
          <div class="empty-title">連線失敗</div>
          <div class="empty-desc">${escapeHTML(lastError?.message || "無法取得 GitHub 檔案資料。")}</div>
          <button class="retry-btn" id="retryContentBtn">重新載入</button>
        </div>`;

      $("#retryLoadBtn")?.addEventListener("click", loadRepository);
      $("#retryContentBtn")?.addEventListener("click", loadRepository);
    }

    function getFolderItems(path) {
      const prefix = path ? `${path}/` : "";
      const children = new Map();

      allFiles.forEach(file => {
        if (!file.path.startsWith(prefix)) return;

        const rest = file.path.slice(prefix.length);
        if (!rest) return;

        const slashIndex = rest.indexOf("/");

        if (slashIndex >= 0) {
          const folderName = rest.slice(0, slashIndex);
          const folderPath = prefix + folderName;

          if (!children.has(folderPath)) {
            children.set(folderPath, {
              name: folderName,
              path: folderPath,
              type: "tree"
            });
          }
        } else {
          children.set(file.path, file);
        }
      });

      return [...children.values()].sort((a, b) => {
        if (a.type !== b.type) return a.type === "tree" ? -1 : 1;
        return a.name.localeCompare(b.name, "zh-Hant", { numeric: true });
      });
    }

    function renderTree() {
      const items = getFolderItems("");

      if (!items.length) {
        treeEl.innerHTML = `<div class="tree-empty">目前沒有可顯示的檔案</div>`;
        return;
      }

      treeEl.innerHTML = `
        <div class="tree-root-label">REPOSITORY / ${escapeHTML(branch.toUpperCase())}</div>
        ${items.map(item => `
          <button class="tree-item ${currentPath === item.path ? "active" : ""}"
            data-path="${escapeHTML(item.path)}"
            data-type="${item.type}">
            <span class="item-symbol">${fileIcon(item)}</span>
            <span class="item-name">${escapeHTML(item.name)}</span>
            <span class="item-chevron">${item.type === "tree" ? "›" : "↗"}</span>
          </button>
        `).join("")}`;

      treeEl.querySelectorAll(".tree-item").forEach(button => {
        button.addEventListener("click", () => {
          const path = button.dataset.path;
          const type = button.dataset.type;

          searchInput.value = "";
          clearSearchBtn.classList.remove("visible");
          searchToken++;

          if (type === "tree") {
            renderFolder(path);
          } else {
            const file = allFiles.find(item => item.path === path);
            if (file) openFile(file);
          }
        });
      });
    }

    function renderBreadcrumbs(path) {
      const parts = path ? path.split("/") : [];
      let accumulated = "";

      const entries = [{
        label: "根目錄",
        path: "",
        current: parts.length === 0
      }];

      parts.forEach((part, index) => {
        accumulated = accumulated ? `${accumulated}/${part}` : part;
        entries.push({
          label: part,
          path: accumulated,
          current: index === parts.length - 1
        });
      });

      crumbsEl.innerHTML = entries.map((entry, index) => `
        ${index ? `<span class="crumb-separator">/</span>` : ""}
        <button class="crumb ${entry.current ? "current" : ""}"
          data-path="${escapeHTML(entry.path)}">${escapeHTML(entry.label)}</button>
      `).join("");

      crumbsEl.querySelectorAll(".crumb").forEach(button => {
        button.addEventListener("click", () => {
          searchInput.value = "";
          clearSearchBtn.classList.remove("visible");
          searchToken++;
          renderFolder(button.dataset.path);
        });
      });
    }

    function renderFolder(path) {
      currentPath = path;
      currentFile = null;

      renderTree();
      renderBreadcrumbs(path);

      const items = getFolderItems(path);
      const folderName = path ? path.split("/").pop() : "課程檔案";

      headerEl.innerHTML = `
        <div class="content-title-wrap">
          <div class="content-kicker">DIRECTORY / BROWSE</div>
          <h2 class="content-title">${escapeHTML(folderName)}</h2>
          <div class="content-subtitle">${path ? escapeHTML(path) : "選擇資料夾或檔案，瀏覽課程內容。"}</div>
        </div>
        <div class="content-actions">
          ${path ? `<button class="action-btn" id="backFolderBtn">← 返回上層</button>` : ""}
        </div>`;

      $("#backFolderBtn")?.addEventListener("click", () => {
        const parent = path.includes("/")
          ? path.slice(0, path.lastIndexOf("/"))
          : "";
        renderFolder(parent);
      });

      if (!items.length) {
        contentEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-symbol">📂</div>
            <div class="empty-title">這個資料夾是空的</div>
            <div class="empty-desc">目前沒有找到檔案或子資料夾。</div>
          </div>`;
        return;
      }

      contentEl.innerHTML = `
        <div class="file-list">
          ${items.map((item, index) => {
            const isFolder = item.type === "tree";
            const meta = isFolder
              ? "資料夾 · 點擊開啟"
              : `${getExtension(item.path).toUpperCase() || "FILE"} 檔案${item.size ? " · " + formatSize(item.size) : ""}`;

            return `
              <button class="file-row"
                data-path="${escapeHTML(item.path)}"
                data-type="${item.type}"
                style="animation-delay:${Math.min(index * 25, 300)}ms">
                <span class="item-symbol">${fileIcon(item)}</span>
                <span class="file-info">
                  <span class="file-name">${escapeHTML(item.name)}</span>
                  <span class="file-meta">${escapeHTML(meta)}</span>
                </span>
                <span class="file-arrow">${isFolder ? "›" : "↗"}</span>
              </button>`;
          }).join("")}
        </div>`;

      contentEl.querySelectorAll(".file-row").forEach(button => {
        button.addEventListener("click", () => {
          const path = button.dataset.path;

          if (button.dataset.type === "tree") {
            renderFolder(path);
          } else {
            const file = allFiles.find(item => item.path === path);
            if (file) openFile(file);
          }
        });
      });
    }

    async function getFileContent(file) {
      if (contentCache.has(file.path)) {
        return contentCache.get(file.path);
      }

      if (!isTextFile(file)) {
        throw new Error("此檔案不是支援預覽的文字檔，或檔案大小超過 1 MB。");
      }

      const url = `${RAW_BASE}/${encodeURIComponent(branch)}/${file.path
        .split("/")
        .map(encodeURIComponent)
        .join("/")}`;

      const promise = fetchText(url);
      contentCache.set(file.path, promise);

      try {
        const text = await promise;
        contentCache.set(file.path, text);
        return text;
      } catch (error) {
        contentCache.delete(file.path);
        throw error;
      }
    }

    function getLanguage(file) {
      const ext = getExtension(file.path);
      const map = {
        sh: "bash", bash: "bash", zsh: "bash",
        md: "markdown", markdown: "markdown",
        js: "javascript", mjs: "javascript", cjs: "javascript",
        ts: "typescript", py: "python",
        html: "xml", htm: "xml", svg: "xml",
        yml: "yaml", yaml: "yaml",
        json: "json", css: "css", xml: "xml",
        c: "c", h: "c", cpp: "cpp", hpp: "cpp",
        java: "java", go: "go", rs: "rust",
        sql: "sql", txt: "plaintext", log: "plaintext",
        csv: "plaintext", makefile: "makefile",
        dockerfile: "dockerfile"
      };
      return map[ext] || "plaintext";
    }

    function highlightCode(text, language) {
      if (!window.hljs) return escapeHTML(text);

      try {
        if (language !== "plaintext" && hljs.getLanguage(language)) {
          return hljs.highlight(text, {
            language,
            ignoreIllegals: true
          }).value;
        }
        return escapeHTML(text);
      } catch {
        return escapeHTML(text);
      }
    }

    function renderMarkdown(text) {
      if (!window.marked) {
        return `<pre>${escapeHTML(text)}</pre>`;
      }

      marked.setOptions({ gfm: true, breaks: true });

      const renderer = new marked.Renderer();

      renderer.link = function ({ href, title, text }) {
        const safe = safeURL(href || "");
        const titleAttr = title ? ` title="${escapeHTML(title)}"` : "";
        if (!safe) return text;

        return `<a href="${escapeHTML(safe)}"${titleAttr} target="_blank" rel="noopener noreferrer">${text}</a>`;
      };

      const html = marked.parse(text, { renderer });
      const template = document.createElement("template");
      template.innerHTML = html;

      template.content.querySelectorAll(
        "script, iframe, object, embed, form"
      ).forEach(el => el.remove());

      template.content.querySelectorAll("*").forEach(el => {
        [...el.attributes].forEach(attr => {
          if (/^on/i.test(attr.name)) {
            el.removeAttribute(attr.name);
          }

          if (["href", "src", "xlink:href"].includes(attr.name)) {
            const safe = safeURL(attr.value);
            if (!safe) el.removeAttribute(attr.name);
            else el.setAttribute(attr.name, safe);
          }
        });
      });

      return template.innerHTML;
    }

    async function openFile(file) {
      currentFile = file;
      currentPath = file.path.includes("/")
        ? file.path.slice(0, file.path.lastIndexOf("/"))
        : "";

      renderTree();
      renderBreadcrumbs(currentPath);

      headerEl.innerHTML = `
        <div class="content-title-wrap">
          <div class="content-kicker">FILE / PREVIEW</div>
          <h2 class="content-title">${escapeHTML(file.name)}</h2>
          <div class="content-subtitle">${escapeHTML(file.path)}</div>
        </div>
        <div class="content-actions">
          <button class="action-btn" id="backToFolderBtn">← 返回資料夾</button>
          <button class="action-btn primary" id="copyFileBtn">複製內容</button>
        </div>`;

      $("#backToFolderBtn").addEventListener("click", () => renderFolder(currentPath));
      $("#copyFileBtn").addEventListener("click", () => copyCurrentFile(file));

      setLoading("正在讀取檔案內容……");

      try {
        const text = await getFileContent(file);

        if (currentFile?.path !== file.path) return;

        const ext = getExtension(file.path);

        if (["md", "markdown"].includes(ext)) {
          contentEl.innerHTML = `<article class="text-view">${renderMarkdown(text)}</article>`;
          contentEl.querySelectorAll("pre code").forEach(block => {
            if (window.hljs) hljs.highlightElement(block);
          });
        } else {
          const language = getLanguage(file);

          contentEl.innerHTML = `
            <div class="code-view">
              <div class="code-toolbar">
                <div class="window-dots"><span></span><span></span><span></span></div>
                <span class="code-language">${escapeHTML(language.toUpperCase())}</span>
              </div>
              <div class="code-container">
                <pre><code>${highlightCode(text, language)}</code></pre>
              </div>
              <div class="code-footer">
                <span>${text.split("\n").length} 行 · ${formatSize(new Blob([text]).size)}</span>
                <button id="copyCodeBtn">複製程式碼 ↗</button>
              </div>
            </div>`;

          $("#copyCodeBtn").addEventListener("click", () => copyText(text));
        }
      } catch (error) {
        console.error(error);

        if (currentFile?.path !== file.path) return;

        contentEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-symbol">⚠</div>
            <div class="empty-title">無法預覽這個檔案</div>
            <div class="empty-desc">${escapeHTML(error.message || "讀取檔案時發生錯誤。")}</div>
            <button class="retry-btn" id="retryFileBtn">重新讀取</button>
          </div>`;

        $("#retryFileBtn").addEventListener("click", () => openFile(file));
      }
    }

    async function copyText(text) {
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const textarea = document.createElement("textarea");
          textarea.value = text;
          textarea.style.position = "fixed";
          textarea.style.opacity = "0";
          document.body.appendChild(textarea);
          textarea.select();

          const success = document.execCommand("copy");
          textarea.remove();

          if (!success) throw new Error("複製失敗");
        }

        showToast("已複製到剪貼簿");
      } catch (error) {
        console.error(error);
        showToast("複製失敗，請檢查瀏覽器權限");
      }
    }

    async function copyCurrentFile(file) {
      try {
        const text = await getFileContent(file);
        await copyText(text);
      } catch {
        showToast("無法複製此檔案");
      }
    }

    function highlightMatch(text, query) {
      const escaped = escapeHTML(text);
      if (!query) return escaped;

      const safeQuery = query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");

      try {
        return escaped.replace(
          new RegExp(safeQuery, "ig"),
          match => `<mark>${match}</mark>`
        );
      } catch {
        return escaped;
      }
    }

    function snippetAround(text, query) {
      const lowerText = text.toLowerCase();
      const index = lowerText.indexOf(query.toLowerCase());

      if (index < 0) return "";

      const start = Math.max(0, index - 65);
      const end = Math.min(text.length, index + query.length + 105);

      return (start > 0 ? "…" : "") +
        text.slice(start, end).replace(/\s+/g, " ").trim() +
        (end < text.length ? "…" : "");
    }

    async function searchAll(query, token) {
      const q = query.trim().toLowerCase();

      if (!q) {
        renderFolder(currentPath);
        return;
      }

      headerEl.innerHTML = `
        <div class="content-title-wrap">
          <div class="content-kicker">SEARCH / GLOBAL</div>
          <h2 class="content-title">搜尋結果</h2>
          <div class="content-subtitle">關鍵字：${escapeHTML(query.trim())}</div>
        </div>`;

      crumbsEl.innerHTML = "";
      setLoading("正在搜尋檔名與程式碼內容……");

      const candidates = allFiles.filter(file =>
        file.path.toLowerCase().includes(q) ||
        file.name.toLowerCase().includes(q)
      );

      const searchable = allFiles.filter(isTextFile);
      const resultMap = new Map();

      candidates.forEach(file => {
        resultMap.set(file.path, {
          file,
          snippet: "",
          matchedBy: "檔名或路徑"
        });
      });

      let index = 0;
      const workerCount = Math.min(8, searchable.length);

      async function worker() {
        while (index < searchable.length) {
          if (token !== searchToken) return;

          const file = searchable[index++];

          if (resultMap.has(file.path)) continue;

          try {
            const text = await getFileContent(file);
            if (token !== searchToken) return;

            if (text.toLowerCase().includes(q)) {
              resultMap.set(file.path, {
                file,
                snippet: snippetAround(text, query.trim()),
                matchedBy: "內容符合"
              });
            }
          } catch (error) {
            console.warn("略過無法搜尋的檔案：", file.path, error);
          }
        }
      }

      await Promise.all(
        Array.from({ length: workerCount }, () => worker())
      );

      if (token !== searchToken) return;

      const results = [...resultMap.values()].sort((a, b) =>
        a.file.path.localeCompare(b.file.path, "zh-Hant", { numeric: true })
      );

      renderSearchResults(query.trim(), results);
    }

    function renderSearchResults(query, results) {
      if (!results.length) {
        contentEl.innerHTML = `
          <div class="empty-state">
            <div class="empty-symbol">⌕</div>
            <div class="empty-title">找不到符合的內容</div>
            <div class="empty-desc">試試其他關鍵字，或使用較短的字詞搜尋。</div>
          </div>`;
        return;
      }

      contentEl.innerHTML = `
        <div class="results-section">
          <div class="results-label">找到 ${results.length} 個符合項目</div>
          ${results.map(({ file, snippet, matchedBy }) => `
            <button class="result-card" data-path="${escapeHTML(file.path)}">
              <span class="result-top">
                <span class="item-symbol">${fileIcon(file)}</span>
                <span class="result-main">
                  <span class="result-name">${highlightMatch(file.name, query)}</span>
                  <span class="result-path">${highlightMatch(file.path, query)}</span>
                  <span class="result-path">${escapeHTML(matchedBy)}</span>
                </span>
                <span class="file-arrow">↗</span>
              </span>
              ${snippet ? `<span class="result-snippet">${highlightMatch(snippet, query)}</span>` : ""}
            </button>
          `).join("")}
        </div>`;

      contentEl.querySelectorAll(".result-card").forEach(button => {
        button.addEventListener("click", () => {
          const file = allFiles.find(item => item.path === button.dataset.path);
          if (!file || isHiddenRootFile(file.path)) return;

          searchInput.value = "";
          clearSearchBtn.classList.remove("visible");
          searchToken++;
          openFile(file);
        });
      });
    }

    searchInput.addEventListener("input", () => {
      const query = searchInput.value;
      clearSearchBtn.classList.toggle("visible", Boolean(query));
      clearTimeout(searchTimer);

      const token = ++searchToken;

      if (!query.trim()) {
        renderFolder(currentPath);
        return;
      }

      searchTimer = setTimeout(() => searchAll(query, token), 300);
    });

    clearSearchBtn.addEventListener("click", () => {
      searchInput.value = "";
      clearSearchBtn.classList.remove("visible");
      searchToken++;
      renderFolder(currentPath);
      searchInput.focus();
    });

    $("#reloadBtn").addEventListener("click", () => {
      searchToken++;
      loadRepository();
    });

    $("#rootBtn").addEventListener("click", () => {
      searchToken++;
      searchInput.value = "";
      clearSearchBtn.classList.remove("visible");
      renderFolder("");
    });

    document.addEventListener("keydown", event => {
      const target = event.target;
      const isTyping = target instanceof HTMLInputElement ||
        target instanceof HTMLTextAreaElement ||
        target.isContentEditable;

      if (
        event.key === "/" &&
        !isTyping &&
        !event.ctrlKey &&
        !event.metaKey &&
        !event.altKey
      ) {
        event.preventDefault();
        searchInput.focus();
      }

      if (event.key === "Escape" && document.activeElement === searchInput) {
        searchInput.value = "";
        clearSearchBtn.classList.remove("visible");
        searchToken++;
        renderFolder(currentPath);
        searchInput.blur();
      }
    });

    loadRepository();
  })();
  </script>
</body>
</html>
