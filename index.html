
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bash 課程學習筆記</title>

<style>
:root {
  --primary: #3563e9;
  --primary-dark: #2348bd;
  --bg: #f5f7fc;
  --card: #fff;
  --text: #202b42;
  --muted: #75819a;
  --border: #e7ebf3;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Inter, "Microsoft JhengHei", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
}
button, input { font: inherit; }
button { cursor: pointer; }
.container {
  max-width: 1000px;
  margin: auto;
  padding: 28px 22px 60px;
}
.hero {
  position: relative;
  overflow: hidden;
  padding: 38px 34px;
  border-radius: 24px;
  color: white;
  background: linear-gradient(125deg,#182c62,#3563e9 72%,#7198ff);
  box-shadow: 0 12px 35px #3563e926;
}
.hero::after {
  content: "</>";
  position: absolute;
  right: 28px;
  bottom: -28px;
  font-size: 145px;
  font-weight: 900;
  color: #ffffff12;
  pointer-events: none;
}
.eyebrow {
  display: inline-block;
  padding: 5px 11px;
  border: 1px solid #ffffff40;
  border-radius: 30px;
  font-size: 12px;
  letter-spacing: 1px;
  color: #e2eaff;
}
.hero h1 {
  margin: 17px 0 7px;
  font-size: clamp(27px,5vw,38px);
  line-height: 1.3;
}
.hero p { margin: 0; color: #dce6ff; font-size: 15px; }
.navigation {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin: 27px 0 18px;
}
.nav-button {
  padding: 9px 15px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: white;
  color: var(--text);
}
.nav-button:hover { border-color: var(--primary); color: var(--primary); }
.nav-button:disabled { opacity: .4; cursor: not-allowed; }
.breadcrumb {
  margin-left: auto;
  color: var(--muted);
  font-size: 13px;
  overflow-wrap: anywhere;
}
.search-box {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 16px;
  margin: 18px 0 12px;
  border: 1px solid var(--border);
  border-radius: 13px;
  background: white;
  transition: .2s;
}
.search-box:focus-within {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px #3563e914;
}
.search-box span { font-size: 23px; }
.search-box input {
  width: 100%;
  padding: 15px 0;
  border: 0;
  outline: none;
  background: transparent;
  color: var(--text);
}
.search-hint { margin: 0 0 24px; color: var(--muted); font-size: 12px; }
.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 22px 0 13px;
}
.section-heading h2 { margin: 0; font-size: 20px; }
.count {
  padding: 4px 10px;
  border-radius: 20px;
  background: #e9efff;
  color: var(--primary);
  font-size: 12px;
  white-space: nowrap;
}
.status { margin: 0 0 12px; color: var(--muted); font-size: 13px; }
.file-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 14px; }
.item {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
  padding: 19px;
  border: 1px solid var(--border);
  border-radius: 15px;
  background: var(--card);
  transition: transform .2s,box-shadow .2s,border-color .2s;
}
.item:hover {
  transform: translateY(-3px);
  border-color: #cbd7ff;
  box-shadow: 0 8px 24px #253c7210;
}
.item-icon {
  display: grid;
  flex-shrink: 0;
  place-items: center;
  width: 48px;
  height: 48px;
  border-radius: 13px;
  background: #edf2ff;
  font-size: 23px;
}
.code-icon { background: #e7f8ef; }
.note-icon { background: #fff4df; }
.item-info { flex: 1; min-width: 0; }
.item-name { font-weight: 700; overflow-wrap: anywhere; line-height: 1.45; }
.item-type { margin-top: 5px; color: var(--muted); font-size: 12px; }
.open-button {
  flex-shrink: 0;
  padding: 7px 11px;
  border: 0;
  border-radius: 8px;
  background: #eef2ff;
  color: var(--primary);
  font-size: 13px;
  font-weight: 600;
}
.open-button:hover { background: var(--primary); color: white; }
.result-path {
  margin-top: 5px;
  color: var(--primary);
  font-size: 12px;
  overflow-wrap: anywhere;
}
.result-snippet {
  margin-top: 9px;
  padding: 9px 11px;
  border-radius: 8px;
  background: #f5f7fc;
  color: #526079;
  font: 12px/1.7 Consolas,"Microsoft JhengHei",monospace;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.viewer {
  grid-column: 1 / -1;
  overflow: hidden;
  margin-top: 8px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: white;
}
.viewer-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  padding: 15px 18px;
  border-bottom: 1px solid var(--border);
}
.viewer-top h3 { margin: 0; font-size: 16px; overflow-wrap: anywhere; }
.viewer-top button {
  padding: 7px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: white;
  color: var(--text);
}
pre {
  margin: 0;
  padding: 23px;
  overflow: auto;
  background: #172033;
  color: #e6edf7;
  font: 14px/1.85 Consolas,"Courier New",monospace;
  tab-size: 4;
  white-space: pre;
}
.viewer-footer { padding: 12px 18px; color: var(--muted); font-size: 12px; }
.empty {
  grid-column: 1 / -1;
  padding: 38px 20px;
  border: 1px dashed #cfd7e7;
  border-radius: 15px;
  background: #ffffff80;
  color: var(--muted);
  text-align: center;
}
.empty strong { display: block; margin-bottom: 5px; color: var(--text); }
footer {
  margin-top: 45px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 12px;
  text-align: center;
}
footer a { color: var(--primary); text-decoration: none; }
@media (max-width:620px) {
  .container { padding: 16px 13px 40px; }
  .hero { padding: 27px 22px; border-radius: 19px; }
  .hero::after { right: 8px; font-size: 95px; }
  .file-grid { grid-template-columns: 1fr; }
  .item { padding: 14px; }
  .item-icon { width: 43px; height: 43px; }
  .breadcrumb { width: 100%; margin-left: 0; }
  pre { padding: 16px; font-size: 12px; }
}
</style>
</head>

<body>
<div class="container">
  <header class="hero">
    <span class="eyebrow">MY PROGRAMMING NOTES</span>
    <h1>計算機與實務應用</h1>
    <p>Bash 課程學習筆記・題目整理・程式碼備份</p>
  </header>

  <nav class="navigation">
    <button class="nav-button" id="homeBtn">⌂ 課程首頁</button>
    <button class="nav-button" id="backBtn" disabled>← 返回上一層</button>
    <div class="breadcrumb" id="breadcrumb">課程目錄</div>
  </nav>

  <label class="search-box">
    <span>⌕</span>
    <input id="searchInput" type="search"
      placeholder="搜尋所有課程、檔名、程式碼或筆記……"
      autocomplete="off">
  </label>
  <p class="search-hint">全站搜尋：輸入關鍵字即可搜尋所有課程的檔名與文字內容。</p>

  <div class="section-heading">
    <h2 id="sectionTitle">課程目錄</h2>
    <span class="count" id="count">載入中</span>
  </div>
  <p class="status" id="status">正在讀取 GitHub 檔案……</p>
  <main id="content" class="file-grid"></main>

  <footer>
    <p>持續學習，持續累積。</p>
    <a href="https://github.com/zongyou0530/bash-course"
       target="_blank" rel="noopener noreferrer">
      在 GitHub 查看所有課程檔案 ↗
    </a>
  </footer>
</div>

<script>
const OWNER = "zongyou0530";
const REPO = "bash-course";
const BRANCH = "main";
const MAX_SEARCH_RESULTS = 100;
const MAX_TEXT_SIZE = 500000;

const content = document.getElementById("content");
const status = document.getElementById("status");
const breadcrumb = document.getElementById("breadcrumb");
const sectionTitle = document.getElementById("sectionTitle");
const count = document.getElementById("count");
const backBtn = document.getElementById("backBtn");
const searchInput = document.getElementById("searchInput");

let currentPath = "";
let historyPaths = [];
let currentItems = [];
let searchIndex = null;
let indexPromise = null;
let requestNumber = 0;
let searchTimer = null;
let isSearching = false;

function encodePath(path) {
  return path.split("/").map(encodeURIComponent).join("/");
}

function apiUrl(path) {
  const suffix = path ? "/" + encodePath(path) : "";
  return `https://api.github.com/repos/${OWNER}/${REPO}/contents${suffix}?ref=${BRANCH}`;
}

function rawUrl(path) {
  return `https://raw.githubusercontent.com/${OWNER}/${REPO}/${BRANCH}/${encodePath(path)}`;
}

function githubUrl(path) {
  return `https://github.com/${OWNER}/${REPO}/blob/${BRANCH}/${encodePath(path)}`;
}

async function getJson(url) {
  const response = await fetch(url);
  if (!response.ok) {
    if (response.status === 403) {
      throw new Error("GitHub API 讀取次數可能已達上限，請稍後再試。");
    }
    throw new Error("無法讀取 GitHub 資料，請檢查網路或稍後再試。");
  }
  return response.json();
}

function setStatus(message) {
  status.textContent = message;
}

function updateNavigation() {
  breadcrumb.textContent = currentPath
    ? "課程目錄 / " + currentPath
    : "課程目錄";
  sectionTitle.textContent = currentPath
    ? currentPath.split("/").pop()
    : "課程目錄";
  backBtn.disabled = historyPaths.length === 0;
}

function fileInfo(item) {
  if (item.type === "dir" || item.type === "tree") {
    return { icon: "📁", cls: "", type: "課程資料夾" };
  }
  const name = item.name.toLowerCase();
  if (/\.(sh|bash|zsh)$/.test(name)) {
    return { icon: "⌨️", cls: "code-icon", type: "Bash 程式碼" };
  }
  if (name.endsWith(".md")) {
    return { icon: "📝", cls: "note-icon", type: "課程筆記" };
  }
  return { icon: "📄", cls: "", type: "檔案" };
}

function makeEmpty(message, detail = "") {
  content.replaceChildren();
  const box = document.createElement("div");
  box.className = "empty";
  const title = document.createElement("strong");
  title.textContent = message;
  box.appendChild(title);
  if (detail) {
    const text = document.createElement("span");
    text.textContent = detail;
    box.appendChild(text);
  }
  content.appendChild(box);
}

function createCard(item, options = {}) {
  const isFolder = item.type === "dir" || item.type === "tree";
  const info = fileInfo(item);
  const card = document.createElement("article");
  card.className = "item";

  const icon = document.createElement("div");
  icon.className = "item-icon " + info.cls;
  icon.textContent = info.icon;

  const details = document.createElement("div");
  details.className = "item-info";

  const name = document.createElement("div");
  name.className = "item-name";
  name.textContent = item.name;

  const type = document.createElement("div");
  type.className = "item-type";
  type.textContent = options.result ? info.type : info.type;

  details.append(name, type);

  if (options.result) {
    const location = document.createElement("div");
    location.className = "result-path";
    location.textContent = item.path;
    details.appendChild(location);

    if (options.snippet) {
      const snippet = document.createElement("div");
      snippet.className = "result-snippet";
      snippet.textContent = options.snippet;
      details.appendChild(snippet);
    }
  }

  const button = document.createElement("button");
  button.className = "open-button";
  button.textContent = isFolder ? "開啟 →" : "查看 →";
  button.addEventListener("click", () => {
    if (isFolder) {
      searchInput.value = "";
      isSearching = false;
      openFolder(item.path);
    } else {
      openFile(item, Boolean(options.result));
    }
  });

  card.append(icon, details, button);
  return card;
}

async function openFolder(path = "", remember = true) {
  if (remember && path !== currentPath) {
    historyPaths.push(currentPath);
  }
  currentPath = path;
  isSearching = false;
  updateNavigation();
  content.replaceChildren();
  setStatus("正在讀取課程資料……");
  count.textContent = "載入中";
  searchIndex = searchIndex; // 保留已建立的全站搜尋索引

  const thisRequest = ++requestNumber;

  try {
    const items = await getJson(apiUrl(path));
    if (thisRequest !== requestNumber) return;
    if (!Array.isArray(items)) throw new Error("這個位置不是資料夾。");

    const folders = items
      .filter(item => item.type === "dir")
      .sort((a, b) => b.name.localeCompare(a.name));

    const files = items
      .filter(item =>
        item.type === "file" &&
        !(path === "" &&
          ["README.md", "index.html"].includes(item.name))
      )
      .sort((a, b) => a.name.localeCompare(b.name));

    currentItems = [...folders, ...files];
    renderFolderItems();
    setStatus(currentItems.length
      ? "選擇資料夾或檔案，即可查看內容。"
      : "這個資料夾目前沒有可顯示的項目。");
  } catch (error) {
    if (thisRequest !== requestNumber) return;
    setStatus(error.message);
    count.textContent = "讀取失敗";
    const retry = document.createElement("button");
    retry.className = "nav-button";
    retry.textContent = "重新載入";
    retry.addEventListener("click", () => openFolder(currentPath, false));
    content.appendChild(retry);
  }
}

function renderFolderItems() {
  content.replaceChildren();
  count.textContent = `${currentItems.length} 個項目`;

  if (!currentItems.length) {
    makeEmpty("這裡還沒有檔案", "上傳課程檔案到 GitHub 後就會出現在這裡。");
    return;
  }
  currentItems.forEach(item => content.appendChild(createCard(item)));
}

function supportedTextFile(path) {
  return /\.(sh|bash|zsh|md|txt)$/i.test(path);
}

function hiddenRootFile(path) {
  return !path.includes("/") &&
    ["README.md", "index.html"].includes(path);
}

async function buildSearchIndex() {
  if (searchIndex) return searchIndex;
  if (indexPromise) return indexPromise;

  indexPromise = (async () => {
    setStatus("第一次搜尋：正在建立全站索引，請稍候……");

    const data = await getJson(
      `https://api.github.com/repos/${OWNER}/${REPO}/git/trees/${BRANCH}?recursive=1`
    );

    if (!Array.isArray(data.tree)) {
      throw new Error("GitHub 沒有回傳有效的檔案清單。");
    }
    if (data.truncated) {
      throw new Error("課程檔案太多，GitHub 回傳的清單不完整，無法保證全站搜尋。");
    }

    const entries = data.tree
      .filter(item =>
        (item.type === "blob" || item.type === "tree") &&
        !hiddenRootFile(item.path)
      )
      .map(item => ({
        name: item.path.split("/").pop(),
        path: item.path,
        type: item.type === "tree" ? "tree" : "file",
        size: item.size || 0,
        content: ""
      }));

    const files = entries.filter(item =>
      item.type === "file" &&
      supportedTextFile(item.path) &&
      item.size <= MAX_TEXT_SIZE
    );

    let finished = 0;
    let next = 0;

    async function worker() {
      while (next < files.length) {
        const file = files[next++];
        try {
          const response = await fetch(rawUrl(file.path));
          if (response.ok) file.content = await response.text();
        } catch {
          // 單一檔案讀取失敗時，仍保留檔名搜尋功能
        }
        finished++;
        setStatus(`建立搜尋索引中：${finished}/${files.length} 個文字檔案……`);
      }
    }

    await Promise.all(
      Array.from({ length: Math.min(6, files.length) }, () => worker())
    );

    searchIndex = entries;
    return searchIndex;
  })();

  try {
    return await indexPromise;
  } finally {
    indexPromise = null;
  }
}

function makeSnippet(text, terms) {
  if (!text) return "";
  const lower = text.toLowerCase();
  let position = -1;

  for (const term of terms) {
    position = lower.indexOf(term);
    if (position >= 0) break;
  }

  if (position < 0) return "";
  const start = Math.max(0, position - 55);
  const end = Math.min(text.length, position + 115);
  return (start > 0 ? "…" : "") +
    text.slice(start, end) +
    (end < text.length ? "…" : "");
}

async function performSearch(query) {
  const thisRequest = ++requestNumber;
  isSearching = true;
  content.replaceChildren();
  sectionTitle.textContent = "全站搜尋";
  breadcrumb.textContent = "課程目錄 / 搜尋";
  count.textContent = "搜尋中";
  setStatus("正在搜尋所有課程……");

  try {
    const index = await buildSearchIndex();
    if (thisRequest !== requestNumber) return;

    const terms = query.toLowerCase().split(/\s+/).filter(Boolean);

    const matches = index.filter(item => {
      const name = item.name.toLowerCase();
      const path = item.path.toLowerCase();
      const text = (item.content || "").toLowerCase();
      const searchable = `${name}\n${path}\n${text}`;
      return terms.every(term => searchable.includes(term));
    });

    count.textContent = `${matches.length} 個結果`;
    content.replaceChildren();

    if (!matches.length) {
      makeEmpty("找不到符合的結果", "試試其他關鍵字，或檢查檔案是否已上傳到 GitHub。");
      setStatus("搜尋完成。");
      return;
    }

    const shown = matches.slice(0, MAX_SEARCH_RESULTS);

    shown.forEach(item => {
      const snippet = makeSnippet(item.content, terms);
      content.appendChild(createCard(item, {
        result: true,
        snippet
      }));
    });

    if (matches.length > MAX_SEARCH_RESULTS) {
      const more = document.createElement("p");
      more.className = "status";
      more.style.gridColumn = "1 / -1";
      more.textContent =
        `目前顯示前 ${MAX_SEARCH_RESULTS} 筆，共找到 ${matches.length} 筆。請加上更精確的關鍵字。`;
      content.appendChild(more);
    }

    setStatus("搜尋完成。點擊結果即可查看檔案或進入資料夾。");
  } catch (error) {
    if (thisRequest !== requestNumber) return;
    count.textContent = "搜尋失敗";
    setStatus(error.message);
    const retry = document.createElement("button");
    retry.className = "nav-button";
    retry.textContent = "重新搜尋";
    retry.addEventListener("click", () => performSearch(searchInput.value.trim()));
    content.appendChild(retry);
  }
}

function openFile(item, fromSearch = false) {
  if (!fromSearch && currentPath !== item.path) {
    historyPaths.push(currentPath);
  }

  const thisRequest = ++requestNumber;
  content.replaceChildren();
  sectionTitle.textContent = item.name;
  breadcrumb.textContent = "課程目錄 / " + item.path;
  count.textContent = "檔案";
  backBtn.disabled = historyPaths.length === 0;
  setStatus("正在讀取檔案……");

  const viewer = document.createElement("section");
  viewer.className = "viewer";

  const top = document.createElement("div");
  top.className = "viewer-top";

  const title = document.createElement("h3");
  title.textContent = "📄 " + item.name;

  const copyButton = document.createElement("button");
  copyButton.textContent = "複製內容";
  copyButton.disabled = true;

  const pre = document.createElement("pre");
  const code = document.createElement("code");
  pre.appendChild(code);

  const footer = document.createElement("div");
  footer.className = "viewer-footer";
  footer.textContent = "來源：GitHub";

  top.append(title, copyButton);
  viewer.append(top, pre, footer);
  content.appendChild(viewer);

  const link = document.createElement("a");
  link.href = githubUrl(item.path);
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  link.textContent = "在 GitHub 查看原始檔案 ↗";
  link.style.display = "inline-block";
  link.style.margin = "16px 0";
  link.style.textDecoration = "none";
  content.appendChild(link);

  fetch(rawUrl(item.path))
    .then(response => {
      if (!response.ok) throw new Error("檔案讀取失敗，請稍後再試。");
      return response.text();
    })
    .then(text => {
      if (thisRequest !== requestNumber) return;
      code.textContent = text;
      copyButton.disabled = false;
      copyButton.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(text);
          copyButton.textContent = "已複製 ✓";
        } catch {
          copyButton.textContent = "複製失敗，請手動選取";
        }
      });
      setStatus("檔案已載入，可以閱讀或複製內容。");
    })
    .catch(error => {
      if (thisRequest !== requestNumber) return;
      setStatus(error.message);
    });
}

searchInput.addEventListener("input", () => {
  clearTimeout(searchTimer);
  const query = searchInput.value.trim();

  searchTimer = setTimeout(() => {
    if (query) {
      performSearch(query);
    } else {
      isSearching = false;
      openFolder(currentPath, false);
    }
  }, 300);
});

document.getElementById("homeBtn").addEventListener("click", () => {
  clearTimeout(searchTimer);
  searchInput.value = "";
  historyPaths = [];
  openFolder("", false);
});

backBtn.addEventListener("click", () => {
  if (!historyPaths.length) return;
  clearTimeout(searchTimer);
  searchInput.value = "";
  isSearching = false;
  const previous = historyPaths.pop();
  openFolder(previous, false);
});

openFolder("", false);
</script>
</body>
</html>
