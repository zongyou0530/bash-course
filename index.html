
<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bash 課程學習筆記</title>

<style>
:root {
  --primary: #3563e9;
  --primary-dark: #2348bd;
  --bg: #f5f7fc;
  --card: #ffffff;
  --text: #202b42;
  --muted: #75819a;
  --border: #e7ebf3;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Inter, "Microsoft JhengHei", Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
}

button, input {
  font: inherit;
}

button {
  cursor: pointer;
}

.container {
  max-width: 1000px;
  margin: 0 auto;
  padding: 28px 22px 60px;
}

/* 頂部標題區 */
.hero {
  position: relative;
  overflow: hidden;
  padding: 38px 34px;
  border-radius: 24px;
  color: white;
  background: linear-gradient(125deg, #182c62, #3563e9 72%, #7198ff);
  box-shadow: 0 12px 35px #3563e926;
}

.hero::after {
  content: "</>";
  position: absolute;
  right: 28px;
  bottom: -28px;
  font-size: 145px;
  font-weight: 900;
  color: #ffffff12;
  pointer-events: none;
}

.eyebrow {
  display: inline-block;
  padding: 5px 11px;
  border: 1px solid #ffffff40;
  border-radius: 30px;
  font-size: 12px;
  letter-spacing: 1px;
  color: #e2eaff;
}

.hero h1 {
  margin: 17px 0 7px;
  font-size: clamp(27px, 5vw, 38px);
  line-height: 1.3;
  letter-spacing: .5px;
}

.hero p {
  margin: 0;
  color: #dce6ff;
  font-size: 15px;
}

/* 導覽列 */
.navigation {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin: 27px 0 18px;
}

.nav-button {
  padding: 9px 15px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: white;
  color: var(--text);
  transition: .2s;
}

.nav-button:hover {
  border-color: var(--primary);
  color: var(--primary);
}

.nav-button:disabled {
  opacity: .4;
  cursor: not-allowed;
}

.breadcrumb {
  margin-left: auto;
  color: var(--muted);
  font-size: 13px;
  overflow-wrap: anywhere;
}

/* 搜尋區 */
.search-box {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 0 16px;
  margin: 18px 0 24px;
  border: 1px solid var(--border);
  border-radius: 13px;
  background: white;
  transition: .2s;
}

.search-box:focus-within {
  border-color: var(--primary);
  box-shadow: 0 0 0 3px #3563e914;
}

.search-box span {
  font-size: 19px;
}

.search-box input {
  width: 100%;
  padding: 15px 0;
  border: 0;
  outline: none;
  background: transparent;
  color: var(--text);
}

/* 標題與狀態 */
.section-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin: 22px 0 13px;
}

.section-heading h2 {
  margin: 0;
  font-size: 20px;
}

.count {
  padding: 4px 10px;
  border-radius: 20px;
  background: #e9efff;
  color: var(--primary);
  font-size: 12px;
}

.status {
  margin: 0 0 12px;
  color: var(--muted);
  font-size: 13px;
}

/* 檔案卡片 */
.file-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.item {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
  padding: 19px;
  border: 1px solid var(--border);
  border-radius: 15px;
  background: var(--card);
  transition: transform .2s, box-shadow .2s, border-color .2s;
}

.item:hover {
  transform: translateY(-3px);
  border-color: #cbd7ff;
  box-shadow: 0 8px 24px #253c7210;
}

.item-icon {
  display: grid;
  flex-shrink: 0;
  place-items: center;
  width: 48px;
  height: 48px;
  border-radius: 13px;
  background: #edf2ff;
  font-size: 23px;
}

.item-icon.code-icon {
  background: #e7f8ef;
}

.item-icon.note-icon {
  background: #fff4df;
}

.item-info {
  flex: 1;
  min-width: 0;
}

.item-name {
  font-weight: 700;
  overflow-wrap: anywhere;
  line-height: 1.45;
}

.item-type {
  margin-top: 5px;
  color: var(--muted);
  font-size: 12px;
}

.open-button {
  flex-shrink: 0;
  padding: 7px 11px;
  border: 0;
  border-radius: 8px;
  background: #eef2ff;
  color: var(--primary);
  font-size: 13px;
  font-weight: 600;
}

.open-button:hover {
  background: var(--primary);
  color: white;
}

/* 程式碼閱讀區 */
.viewer {
  overflow: hidden;
  margin-top: 18px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: white;
}

.viewer-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 10px;
  padding: 15px 18px;
  border-bottom: 1px solid var(--border);
}

.viewer-top h3 {
  margin: 0;
  font-size: 16px;
  overflow-wrap: anywhere;
}

.viewer-top button {
  padding: 7px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: white;
  color: var(--text);
}

pre {
  margin: 0;
  padding: 23px;
  overflow: auto;
  background: #172033;
  color: #e6edf7;
  font: 14px/1.85 Consolas, "Courier New", monospace;
  tab-size: 4;
  white-space: pre;
}

.viewer-footer {
  padding: 12px 18px;
  color: var(--muted);
  font-size: 12px;
}

.empty {
  padding: 38px 20px;
  border: 1px dashed #cfd7e7;
  border-radius: 15px;
  background: #ffffff80;
  color: var(--muted);
  text-align: center;
}

.empty strong {
  display: block;
  margin-bottom: 5px;
  color: var(--text);
}

footer {
  margin-top: 45px;
  padding-top: 20px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 12px;
  text-align: center;
}

footer a {
  color: var(--primary);
  text-decoration: none;
}

@media (max-width: 620px) {
  .container {
    padding: 16px 13px 40px;
  }

  .hero {
    padding: 27px 22px;
    border-radius: 19px;
  }

  .hero::after {
    right: 8px;
    font-size: 95px;
  }

  .file-grid {
    grid-template-columns: 1fr;
  }

  .item {
    padding: 14px;
  }

  .item-icon {
    width: 43px;
    height: 43px;
  }

  .breadcrumb {
    width: 100%;
    margin-left: 0;
  }

  pre {
    padding: 16px;
    font-size: 12px;
  }
}
</style>
</head>

<body>
<div class="container">

  <header class="hero">
    <span class="eyebrow">MY PROGRAMMING NOTES</span>
    <h1>計算機與實務應用</h1>
    <p>Bash 課程學習筆記・題目整理・程式碼備份</p>
  </header>

  <nav class="navigation">
    <button class="nav-button" id="homeBtn">⌂ 課程首頁</button>
    <button class="nav-button" id="backBtn" disabled>← 返回上一層</button>
    <div class="breadcrumb" id="breadcrumb">課程目錄</div>
  </nav>

  <label class="search-box">
    <span>⌕</span>
    <input
      id="searchInput"
      type="search"
      placeholder="搜尋課程、題目或程式檔案……"
      autocomplete="off"
    >
  </label>

  <div class="section-heading">
    <h2 id="sectionTitle">課程目錄</h2>
    <span class="count" id="count">載入中</span>
  </div>

  <p class="status" id="status">正在讀取 GitHub 檔案……</p>
  <main id="content" class="file-grid"></main>

  <footer>
    <p>持續學習，持續累積。</p>
    <a href="https://github.com/zongyou0530/bash-course"
       target="_blank" rel="noopener noreferrer">
      在 GitHub 查看所有課程檔案 ↗
    </a>
  </footer>

</div>

<script>
const OWNER = "zongyou0530";
const REPO = "bash-course";
const BRANCH = "main";

const content = document.getElementById("content");
const status = document.getElementById("status");
const breadcrumb = document.getElementById("breadcrumb");
const sectionTitle = document.getElementById("sectionTitle");
const count = document.getElementById("count");
const backBtn = document.getElementById("backBtn");
const searchInput = document.getElementById("searchInput");

let currentPath = "";
let historyPaths = [];
let currentItems = [];
let requestNumber = 0;

function apiUrl(path) {
  const encoded = path
    .split("/")
    .filter(Boolean)
    .map(encodeURIComponent)
    .join("/");

  return `https://api.github.com/repos/${OWNER}/${REPO}/contents/${encoded}?ref=${BRANCH}`;
}

async function getJson(url) {
  const response = await fetch(url);

  if (!response.ok) {
    if (response.status === 403) {
      throw new Error("GitHub 讀取次數可能已達上限，請稍後再試。");
    }
    throw new Error("無法讀取 GitHub 檔案，請稍後再試。");
  }

  return response.json();
}

function setStatus(message) {
  status.textContent = message;
}

function updateNavigation() {
  breadcrumb.textContent = currentPath
    ? "課程目錄 / " + currentPath
    : "課程目錄";

  sectionTitle.textContent = currentPath
    ? currentPath.split("/").pop()
    : "課程目錄";

  backBtn.disabled = historyPaths.length === 0;
}

function getFileInfo(item) {
  const name = item.name.toLowerCase();

  if (item.type === "dir") {
    return {
      icon: "📁",
      className: "",
      type: "課程資料夾"
    };
  }

  if (name.endsWith(".sh")) {
    return {
      icon: "⌨️",
      className: "code-icon",
      type: "Bash 程式碼"
    };
  }

  if (name.endsWith(".md")) {
    return {
      icon: "📝",
      className: "note-icon",
      type: "課程筆記"
    };
  }

  return {
    icon: "📄",
    className: "",
    type: "檔案"
  };
}

function renderItems() {
  content.replaceChildren();

  const keyword = searchInput.value.trim().toLowerCase();

  const visibleItems = currentItems.filter(item =>
    item.name.toLowerCase().includes(keyword)
  );

  count.textContent = `${visibleItems.length} 個項目`;

  if (visibleItems.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.style.gridColumn = "1 / -1";

    const title = document.createElement("strong");
    title.textContent = keyword ? "找不到符合的項目" : "這裡還沒有檔案";

    const detail = document.createElement("span");
    detail.textContent = keyword
      ? "試試其他關鍵字。"
      : "你可以把課程資料上傳到 GitHub。";

    empty.append(title, detail);
    content.appendChild(empty);
    return;
  }

  visibleItems.forEach(item => {
    const isFolder = item.type === "dir";
    const info = getFileInfo(item);

    const card = document.createElement("article");
    card.className = "item";

    const icon = document.createElement("div");
    icon.className = "item-icon " + info.className;
    icon.textContent = info.icon;

    const details = document.createElement("div");
    details.className = "item-info";

    const name = document.createElement("div");
    name.className = "item-name";
    name.textContent = item.name;

    const type = document.createElement("div");
    type.className = "item-type";
    type.textContent = info.type;

    details.append(name, type);

    const button = document.createElement("button");
    button.className = "open-button";
    button.textContent = isFolder ? "開啟 →" : "查看 →";

    button.addEventListener("click", () => {
      if (isFolder) {
        openFolder(item.path);
      } else {
        openFile(item);
      }
    });

    card.append(icon, details, button);
    content.appendChild(card);
  });
}

async function openFolder(path = "", remember = true) {
  if (remember && path !== currentPath) {
    historyPaths.push(currentPath);
  }

  currentPath = path;
  updateNavigation();

  content.replaceChildren();
  setStatus("正在讀取課程資料……");
  count.textContent = "載入中";
  searchInput.value = "";

  const thisRequest = ++requestNumber;

  try {
    const items = await getJson(apiUrl(path));

    if (thisRequest !== requestNumber) return;

    if (!Array.isArray(items)) {
      throw new Error("這個位置不是資料夾。");
    }

    const folders = items
      .filter(item => item.type === "dir")
      .sort((a, b) => b.name.localeCompare(a.name));

    const files = items
      .filter(item =>
        item.type === "file" &&
        !(path === "" &&
          ["README.md", "index.html"].includes(item.name))
      )
      .sort((a, b) => a.name.localeCompare(b.name));

    currentItems = [...folders, ...files];

    renderItems();

    setStatus(
      currentItems.length
        ? "選擇資料夾或檔案，即可開始學習。"
        : "這個資料夾目前沒有可顯示的項目。"
    );
  } catch (error) {
    if (thisRequest !== requestNumber) return;

    setStatus(error.message);
    count.textContent = "讀取失敗";

    const retry = document.createElement("button");
    retry.className = "nav-button";
    retry.textContent = "重新載入";
    retry.addEventListener("click", () => openFolder(currentPath, false));
    content.appendChild(retry);
  }
}

async function openFile(item) {
  const thisRequest = ++requestNumber;

  content.replaceChildren();
  sectionTitle.textContent = item.name;
  breadcrumb.textContent = "課程目錄 / " + item.path;
  count.textContent = "檔案";
  setStatus("正在讀取檔案……");

  const viewer = document.createElement("section");
  viewer.className = "viewer";

  const top = document.createElement("div");
  top.className = "viewer-top";

  const title = document.createElement("h3");
  title.textContent = "📄 " + item.name;

  const copyButton = document.createElement("button");
  copyButton.textContent = "複製程式碼";

  const pre = document.createElement("pre");
  const code = document.createElement("code");
  pre.appendChild(code);

  const footer = document.createElement("div");
  footer.className = "viewer-footer";
  footer.textContent = "來源：GitHub";

  const link = document.createElement("a");
  link.href = item.html_url;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  link.textContent = "在 GitHub 查看原始檔案 ↗";
  link.style.display = "inline-block";
  link.style.margin = "16px 0";
  link.style.textDecoration = "none";

  top.append(title, copyButton);
  viewer.append(top, pre, footer);
  content.append(viewer, link);

  try {
    const response = await fetch(item.download_url);

    if (!response.ok) {
      throw new Error("檔案讀取失敗，請稍後再試。");
    }

    const text = await response.text();

    if (thisRequest !== requestNumber) return;

    code.textContent = text;
    setStatus("檔案已載入，可以閱讀或複製程式碼。");

    copyButton.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(text);
        copyButton.textContent = "已複製 ✓";
      } catch {
        copyButton.textContent = "複製失敗，請手動選取";
      }
    });
  } catch (error) {
    if (thisRequest !== requestNumber) return;
    setStatus(error.message);
  }
}

document.getElementById("homeBtn").addEventListener("click", () => {
  historyPaths = [];
  openFolder("", false);
});

backBtn.addEventListener("click", () => {
  if (historyPaths.length === 0) return;
  const previous = historyPaths.pop();
  openFolder(previous, false);
});

searchInput.addEventListener("input", renderItems);

openFolder("", false);
</script>
</body>
</html>
